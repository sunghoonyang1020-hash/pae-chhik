function DatePicker({ startDate, endDate, holidays, selected, onToggle }) {
  const [viewMonth, setViewMonth] = useState(() => { const d = pd(startDate); return { y: d.getFullYear(), m: d.getMonth() }; });
  const monthStart = new Date(viewMonth.y, viewMonth.m, 1);
  const monthEnd = new Date(viewMonth.y, viewMonth.m + 1, 0);
  const startDOW = monthStart.getDay();
  const daysInMonth = monthEnd.getDate();
  const prevMonth = () => { const prev = new Date(viewMonth.y, viewMonth.m - 1, 1); setViewMonth({ y: prev.getFullYear(), m: prev.getMonth() }); };
  const nextMonth = () => { const next = new Date(viewMonth.y, viewMonth.m + 1, 1); setViewMonth({ y: next.getFullYear(), m: next.getMonth() }); };
  const cells = [];
  for (let i = 0; i < startDOW; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const DOW = ['일','월','화','수','목','금','토'];
  
  return (
    <div className="bg-white border border-stone-200 rounded-xl overflow-hidden">
      <div className="flex items-center justify-between px-3 py-2 bg-stone-50 border-b border-stone-200">
        <button type="button" onClick={prevMonth} className="p-1 hover:bg-stone-200 rounded"><ChevronLeft className="w-4 h-4" /></button>
        <div className="text-sm font-bold tabular-nums">{viewMonth.y}년 {viewMonth.m + 1}월</div>
        <button type="button" onClick={nextMonth} className="p-1 hover:bg-stone-200 rounded"><ChevronRight className="w-4 h-4" /></button>
      </div>
      <div className="grid grid-cols-7 gap-0.5 p-2">
        {DOW.map((d, i) => (
          <div key={d} className={`text-center text-[10px] font-bold py-1 ${i===0?'text-rose-500':i===6?'text-sky-500':'text-stone-400'}`}>{d}</div>
        ))}
        {cells.map((day, i) => {
          if (day === null) return <div key={`empty-${i}`}></div>;
          const ds = fd(new Date(viewMonth.y, viewMonth.m, day));
          const inRange = ds >= startDate && ds <= endDate;
          const isHoliday = holidays.includes(ds);
          const isSelected = selected.includes(ds);
          const dowIdx = new Date(viewMonth.y, viewMonth.m, day).getDay();
          return (
            <button key={ds} type="button" onClick={() => inRange && onToggle(ds)} disabled={!inRange}
              className={`aspect-square text-xs font-semibold rounded-md transition-colors ${
                !inRange ? 'text-stone-300 cursor-not-allowed' : isSelected ? 'bg-rose-500 text-white' : isHoliday ? 'bg-amber-50 text-amber-700 hover:bg-amber-100' : dowIdx === 0 ? 'text-rose-500 hover:bg-rose-50' : dowIdx === 6 ? 'text-sky-500 hover:bg-sky-50' : 'text-stone-700 hover:bg-stone-100'
              }`}>{day}</button>
          );
        })}
      </div>
    </div>
  );
}

// 직접입력 칸: 입력 중엔 로컬 state로만 두고, 멈추거나(0.7초) 포커스 떠날 때 저장.
// → 자모 단위 onChange race를 원천 차단 (DB엔 완성된 값만 들어감)
function FreeInput({ value, onCommit, autoFocus }) {
  const [local, setLocal] = useState(value);
  const timer = useRef(null);
  const composing = useRef(false);

  // 바깥 value가 바뀌면(다른 곳에서 갱신) 동기화 — 단, 입력 중이 아닐 때만
  useEffect(() => {
    if (!composing.current) setLocal(value);
  }, [value]);

  const commit = (val) => {
    if (timer.current) { clearTimeout(timer.current); timer.current = null; }
    if (val !== value) onCommit(val);
  };

  const onChange = (e) => {
    const val = e.target.value;
    setLocal(val);
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => commit(val), 700);
  };

  return (
    <input type="text" value={local} autoFocus={autoFocus}
      onChange={onChange}
      onCompositionStart={() => { composing.current = true; }}
      onCompositionEnd={(e) => { composing.current = false; setLocal(e.target.value); }}
      onBlur={() => commit(local)}
      placeholder="직접 입력"
      className="flex-1 min-w-0 px-2 py-1.5 bg-stone-50 border border-stone-200 rounded-md text-xs" />
  );
}

function Timetable({ today, periods, onAdd, onUpdate, onDelete, onToggle, onSetQty, schedule, checked, missed, onTaskCheck, courses }) {
  const [date, setDate] = useState(today);
  const [pickerFor, setPickerFor] = useState(null); // 할당 모달 띄울 교시번호(no)
  const dayPeriods = periods[date] || [];

  // 교시 슬롯: 1~7 + 자습(8)
  const SLOTS = [
    { no: 1, label: '1교시' }, { no: 2, label: '2교시' }, { no: 3, label: '3교시' },
    { no: 4, label: '4교시' }, { no: 5, label: '5교시' }, { no: 6, label: '6교시' },
    { no: 7, label: '7교시' }, { no: 8, label: '자습' },
  ];

  // 교시별 항목들 그룹핑
  const bySlot = (no) => dayPeriods.filter(p => p.no === no);

  const filled = dayPeriods.filter(p => p.task?.trim()).length;
  const doneCount = dayPeriods.filter(p => p.done && p.task?.trim()).length;
  const pct = filled > 0 ? Math.round(doneCount / filled * 100) : 0;

  // 할당 후보들 (선택 날짜 기준)
  const assignedTasks = useMemo(() => {
    const day = schedule[date];
    if (!day) return [];
    return day.tasks.filter(t => t.courseId !== 'exam').map(t => ({ ...t, isMissed: false }));
  }, [schedule, date]);

  // 선택한 날짜 기준으로 그 이전에 밀린 강의 계산 (진도형만, 미달성)
  const missedTasks = useMemo(() => {
    const out = [];
    for (const ds of Object.keys(schedule).sort()) {
      if (ds >= date) break; // 선택 날짜 이전만
      const d = schedule[ds];
      if (!d || d.isHoliday) continue;
      for (const t of d.tasks) {
        if (!t.carryable) continue;
        if (t.type === 'quota' || t.type === 'custom') continue;
        if (t.courseId === 'exam' || t.isPostComplete) continue;
        const v = getVal(checked[t.id]);
        if (v < t.target) out.push({ ...t, originalDate: ds, isMissed: true });
      }
    }
    return out;
  }, [schedule, checked, date]);

  const stockCourses = useMemo(() => {
    const list = (courses || []).filter(c => c.type === 'stock');
    return list.map(c => {
      let used = 0;
      for (const arr of Object.values(periods)) {
        for (const p of arr) {
          if (p.done && p.linkedTaskId === `stock:${c.id}`) used += (p.qty != null ? p.qty : (c.stepUnit || 1));
        }
      }
      const left = Math.max(0, (c.stockTotal || 0) - used);
      return { ...c, used, left };
    });
  }, [courses, periods]);

  const assignedCourseIds = useMemo(() => new Set(assignedTasks.map(t => t.courseId)), [assignedTasks]);

  const otherCourses = useMemo(() => {
    const out = [];
    for (const c of (courses || [])) {
      if (c.type === 'stock') continue;
      if (assignedCourseIds.has(c.id)) continue;
      if (c.type === 'lesson') {
        // 다음 풀 강 = doneLessons + 실제로 푼 누적(checked) + 1
        // schedule에 깔린 "미래 예정분"은 아직 안 푼 거니까 건너뛰면 안 됨!
        // 각 checked가 몇 강 분량인지 task text에서 파싱, 없으면 achieved 값으로
        let pulled = 0;
        for (const [tid, v] of Object.entries(checked)) {
          if (!tid.startsWith(`${c.id}:`)) continue;
          const val = getVal(v);
          if (val <= 0) continue;
          pulled += val; // 진도형은 achieved가 "푼 강 수"
        }
        const doneNow = (c.doneLessons || 0) + pulled;
        const start = doneNow + 1;
        const total = c.totalLessons || 0;
        if (start > total) continue;
        const per = Math.max(1, c.lessonsPerDay || 1);
        const end = Math.min(start + per - 1, total);
        const text = end > start ? `${c.name} ${start}~${end}${c.unit}` : `${c.name} ${start}${c.unit}`;
        out.push({ courseId: c.id, subject: c.subject, name: c.name, text, type: 'lesson', start, end, unit: c.unit, isExtra: true });
      } else if (c.type === 'quota') {
        out.push({ courseId: c.id, subject: c.subject, name: c.name, text: `${c.name} (추가 ${c.dailyAmount||1}${c.unit})`, type: 'quota', amount: c.dailyAmount||1, unit: c.unit, isExtra: true });
      } else if (c.type === 'custom') {
        out.push({ courseId: c.id, subject: c.subject, name: c.name, text: `${c.name} (추가)`, type: 'custom', unit: c.unit||'', isExtra: true });
      }
    }
    return out;
  }, [courses, assignedCourseIds, schedule, checked]);

  const linkCount = (taskId) => dayPeriods.filter(p => p.linkedTaskId === taskId).length;
  const pickList = [...assignedTasks, ...missedTasks];
  const hasAnyCandidate = pickList.length > 0 || stockCourses.filter(sc=>sc.left>0).length > 0 || otherCourses.length > 0;

  // 직접입력 항목 새로 추가 (빈 칸)
  const addBlank = (no) => onAdd(date, no, { subject: '기타', task: '' });

  // 할당 모달에서 선택
  const pickTask = (no, task) => {
    onAdd(date, no, {
      subject: task.subject,
      task: task.text + (task.isMissed ? ` (${task.originalDate?.slice(5).replace('-','/')} 밀림)` : ''),
      linkedTaskId: task.id,
    });
    setPickerFor(null);
  };
  const pickExtra = (no, ec) => {
    onAdd(date, no, { subject: ec.subject, task: ec.text, linkedTaskId: `${ec.courseId}:${date}` });
    setPickerFor(null);
  };
  const pickStock = (no, sc) => {
    // 현재까지 이 비축형을 시간표에 꽂은 항목 수 → 다음 회차
    let usedCount = 0;
    for (const arr of Object.values(periods)) {
      for (const p of arr) {
        if (p.linkedTaskId === `stock:${sc.id}`) usedCount++;
      }
    }
    const seq = usedCount + 1;
    // qty 기본값을 stepUnit으로 넣어 추가 즉시 소진에 반영 (사용자가 0.5 등으로 수정 가능)
    onAdd(date, no, { subject: sc.subject, task: `${sc.name} (${seq}회차)`, linkedTaskId: `stock:${sc.id}`, qty: sc.stepUnit || 1 });
    setPickerFor(null);
  };

  return (
    <>
      <div className="bg-gradient-to-br from-indigo-500 via-purple-500 to-fuchsia-500 rounded-2xl p-5 text-white shadow-lg mb-4">
        <div className="flex items-center gap-2 mb-1">
          <Pencil className="w-5 h-5" />
          <h2 className="text-sm font-bold uppercase tracking-wider">오늘 시간표</h2>
        </div>
        <div className="text-3xl font-black tabular-nums mb-1">{pct}%</div>
        <div className="text-xs opacity-90 tabular-nums">{doneCount} / {filled}개 달성 · 채워진 항목 {filled}개</div>
      </div>

      <div className="bg-white rounded-xl border border-stone-200 p-3 mb-4 flex items-center gap-2">
        <button onClick={() => setDate(fd(addD(pd(date), -1)))} className="p-1.5 hover:bg-stone-100 rounded"><ChevronLeft className="w-4 h-4" /></button>
        <input type="date" value={date} onChange={e => setDate(e.target.value)}
          className="flex-1 px-3 py-1.5 bg-stone-50 border border-stone-200 rounded-lg text-sm text-center font-bold tabular-nums" />
        <button onClick={() => setDate(fd(addD(pd(date), 1)))} className="p-1.5 hover:bg-stone-100 rounded"><ChevronRight className="w-4 h-4" /></button>
        <button onClick={() => setDate(today)} className="text-xs px-3 py-1.5 bg-stone-800 text-white rounded-lg font-semibold">오늘</button>
      </div>

      <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-[11px] text-amber-800">
        💡 한 교시에 <b>여러 개</b> 넣을 수 있어. <b>+ 직접</b>으로 입력하거나 <b>+ 할당</b>으로 과제 골라넣기. 직접입력은 글자 다 치고 <b>잠깐 멈추거나 다른 데를 누르면</b> 저장돼. 항목마다 <b>"한 양"</b>에 실제로 한 개수를 적으면 캘린더·비축에 반영돼 (0.5도 가능).
      </div>

      <div className="space-y-3">
        {SLOTS.map(slot => {
          const items = bySlot(slot.no);
          const isJaseup = slot.no === 8;
          return (
            <div key={slot.no} className={`bg-white rounded-xl border ${isJaseup?'border-violet-300':'border-stone-200'} shadow-sm overflow-hidden`}>
              <div className={`px-3 py-2 flex items-center justify-between ${isJaseup?'bg-violet-50':'bg-stone-50'} border-b ${isJaseup?'border-violet-200':'border-stone-100'}`}>
                <div className="flex items-center gap-1.5">
                  {isJaseup && <span className="text-sm">🏠</span>}
                  <span className={`text-xs font-bold ${isJaseup?'text-violet-700':'text-stone-600'}`}>{slot.label}</span>
                  {items.length > 0 && <span className="text-[10px] text-stone-400 tabular-nums">· {items.filter(i=>i.done).length}/{items.length}</span>}
                </div>
                <div className="flex gap-1">
                  <button onClick={() => addBlank(slot.no)} className="px-2 py-1 bg-stone-200 hover:bg-stone-300 text-stone-700 rounded-md text-[10px] font-bold">+ 직접</button>
                  <button onClick={() => setPickerFor(slot.no)} disabled={!hasAnyCandidate}
                    className="px-2 py-1 bg-indigo-500 hover:bg-indigo-600 disabled:bg-stone-200 disabled:text-stone-400 text-white rounded-md text-[10px] font-bold">+ 할당</button>
                </div>
              </div>
              <div className="p-2 space-y-1.5">
                {items.length === 0 && (
                  <div className="text-center py-3 text-[11px] text-stone-300">아직 없음 · 위 버튼으로 추가</div>
                )}
                {items.map(p => {
                  const cfg = p.subject ? getSub(p.subject) : SUBJECTS.기타;
                  const hasTask = p.task?.trim();
                  const isLinked = !!p.linkedTaskId;
                  const isStock = isLinked && p.linkedTaskId.startsWith('stock:');
                  // 기본 수량(미입력시): 연동=target, 비축=stepUnit, 직접=1
                  let defQty = 1;
                  if (isStock) {
                    const sc = (courses||[]).find(c => `stock:${c.id}` === p.linkedTaskId);
                    defQty = sc ? (sc.stepUnit || 1) : 1;
                  } else if (isLinked) {
                    const ltd = p.linkedTaskId.split(':')[1];
                    const lt = schedule[ltd]?.tasks?.find(t => t.id === p.linkedTaskId);
                    if (lt) defQty = lt.target;
                    else { const m = p.task.match(/(\d+)~(\d+)/); defQty = m ? Number(m[2])-Number(m[1])+1 : 1; }
                  }
                  const qtyUnit = isStock ? '' : (() => {
                    const c = (courses||[]).find(c => p.linkedTaskId && p.linkedTaskId.startsWith(c.id+':'));
                    return c?.unit || '';
                  })();
                  return (
                    <div key={p.id} className={`rounded-lg border ${p.done?'border-emerald-400 bg-emerald-50/50':hasTask?cfg.bd:'border-stone-200'} p-2`}>
                      <div className="flex items-center gap-2">
                        <button onClick={() => onToggle(date, p.id)} disabled={!hasTask}
                          className={`flex-shrink-0 w-6 h-6 rounded-md border-2 flex items-center justify-center font-bold text-xs
                          ${p.done?'bg-emerald-500 border-emerald-500 text-white':hasTask?`bg-white ${cfg.bd.replace('-200','-400')}`:'bg-stone-100 border-stone-200 text-stone-400'}`}>
                          {p.done ? <Check className="w-3.5 h-3.5" /> : '·'}
                        </button>
                        {isLinked ? (
                          <div className="flex-1 min-w-0 flex items-center gap-1.5">
                            <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${cfg.ch} flex-shrink-0`}>{p.subject}</span>
                            <span className="text-xs font-semibold text-stone-800 truncate flex-1">{p.task}</span>
                            <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded flex-shrink-0 ${isStock?'bg-purple-100 text-purple-700':'bg-indigo-100 text-indigo-700'}`}>{isStock?'비축':'🔗'}</span>
                            <button onClick={() => onDelete(date, p.id)} className="p-1 hover:bg-stone-100 rounded flex-shrink-0"><X className="w-3.5 h-3.5 text-stone-400" /></button>
                          </div>
                        ) : (
                          <>
                            <select value={p.subject || '기타'} onChange={e => onUpdate(date, p.id, { subject: e.target.value })}
                              className="px-2 py-1.5 bg-stone-50 border border-stone-200 rounded-md text-xs font-bold w-16 flex-shrink-0">
                              {SUB_LIST.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                            <FreeInput value={p.task || ''} autoFocus={!p.task}
                              onCommit={(val) => onUpdate(date, p.id, { task: val })} />
                            <button onClick={() => onDelete(date, p.id)} className="p-1 hover:bg-stone-100 rounded flex-shrink-0"><X className="w-3.5 h-3.5 text-stone-400" /></button>
                          </>
                        )}
                      </div>
                      {hasTask && (
                        <div className="mt-1.5 ml-8 flex items-center gap-1.5 flex-wrap">
                          <span className="text-[10px] text-stone-400">한 양:</span>
                          <input type="number" min="0" step="0.5" value={p.qty != null ? p.qty : ''}
                            onChange={e => {
                              const v = e.target.value;
                              onSetQty(date, p.id, v === '' ? null : Math.max(0, Number(v)));
                            }}
                            placeholder={String(defQty)}
                            className="w-16 px-2 py-1 bg-white border border-stone-300 rounded-md text-xs text-center tabular-nums" />
                          <span className="text-[10px] text-stone-500">
                            {isStock ? `/ 비축 ${defQty}씩` : qtyUnit ? qtyUnit : ''}
                            {!isStock && isLinked && ` (기본 ${defQty}${qtyUnit})`}
                          </span>
                          {p.qty != null && p.qty !== defQty && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">직접 입력함</span>}
                        </div>
                      )}
                      {p.done && p.completedAt && (
                        <div className="mt-1 ml-8 text-[10px] text-emerald-700 font-semibold">✓ {p.completedAt.slice(5).replace('-','/')} 달성{isLinked && !isStock && ' · 캘린더 반영됨'}{p.qty != null && ` · ${p.qty}${isStock?'개':qtyUnit} 반영`}</div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {filled > 0 && (
        <div className="mt-4 text-center text-xs text-stone-500">
          {pct === 100 ? '🔥 완벽한 하루' : pct >= 50 ? '💪 절반 넘김' : pct > 0 ? '🌱 시작은 했어' : '😴 아직 체크 안 함'}
        </div>
      )}

      {/* 할당 과제 선택 모달 */}
      {pickerFor !== null && (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 fade-in" onClick={() => setPickerFor(null)}>
          <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[80vh] overflow-y-auto shadow-2xl" onClick={e=>e.stopPropagation()}>
            <div className="sticky top-0 bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between z-10">
              <div>
                <h3 className="text-base font-bold">{pickerFor === 8 ? '자습' : `${pickerFor}교시`}에 넣을 과제</h3>
                <div className="text-[11px] text-stone-500">{date.slice(5).replace('-','/')} · 골라서 추가 (중복 가능)</div>
              </div>
              <button onClick={() => setPickerFor(null)} className="p-1.5 hover:bg-stone-100 rounded-lg"><X className="w-5 h-5" /></button>
            </div>
            <div className="p-4 space-y-3">
              {assignedTasks.length > 0 && (
                <div>
                  <div className="text-xs font-bold text-stone-700 mb-2">📚 오늘 할당된 과제</div>
                  <div className="space-y-1.5">
                    {assignedTasks.map(t => {
                      const cfg = getSub(t.subject);
                      const v = getVal(checked[t.id]);
                      const isDone = v >= t.target;
                      const lc = linkCount(t.id);
                      return (
                        <button key={t.id} onClick={() => pickTask(pickerFor, t)}
                          className={`w-full flex items-center gap-2 p-2.5 rounded-lg border text-left ${isDone?'bg-emerald-50 border-emerald-200':`${cfg.bg} ${cfg.bd}`} hover:brightness-95`}>
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${cfg.ch} flex-shrink-0`}>{t.subject}</span>
                          <span className="text-xs font-semibold text-stone-800 flex-1 truncate">{t.text}</span>
                          {lc > 0 && <span className="text-[9px] text-indigo-700 font-bold flex-shrink-0">🔗{lc}</span>}
                          {isDone && <span className="text-[9px] text-emerald-700 font-bold flex-shrink-0">달성</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
              {missedTasks.length > 0 && (
                <div>
                  <div className="text-xs font-bold text-amber-800 mb-2">🔥 밀린 강의 ({missedTasks.length}개) · 이 날 전까지 안 푼 거</div>
                  <div className="space-y-1.5">
                    {missedTasks.map(t => {
                      const cfg = getSub(t.subject);
                      const lc = linkCount(t.id);
                      return (
                        <button key={t.id} onClick={() => pickTask(pickerFor, t)}
                          className="w-full flex items-center gap-2 p-2.5 rounded-lg border bg-amber-50 border-amber-200 text-left hover:brightness-95">
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${cfg.ch} flex-shrink-0`}>{t.subject}</span>
                          <span className="text-xs font-semibold text-stone-800 flex-1 truncate">{t.text}</span>
                          {lc > 0 && <span className="text-[9px] text-indigo-700 font-bold flex-shrink-0">🔗{lc}</span>}
                          {t.originalDate && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-amber-200 text-amber-900 tabular-nums flex-shrink-0">{t.originalDate.slice(5).replace('-','/')} 밀림</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
              {stockCourses.length > 0 && (
                <div>
                  <div className="text-xs font-bold text-indigo-700 mb-2">📦 비축형 꺼내기 (실모 등)</div>
                  <div className="space-y-1.5">
                    {stockCourses.map(sc => {
                      const cfg = getSub(sc.subject);
                      const soldOut = sc.left <= 0;
                      const lc = linkCount(`stock:${sc.id}`);
                      return (
                        <button key={sc.id} onClick={() => !soldOut && pickStock(pickerFor, sc)} disabled={soldOut}
                          className={`w-full flex items-center gap-2 p-2.5 rounded-lg border text-left ${soldOut?'bg-stone-50 border-stone-200 opacity-60 cursor-not-allowed':`${cfg.bg} ${cfg.bd} hover:brightness-95`}`}>
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${cfg.ch} flex-shrink-0`}>{sc.subject}</span>
                          <span className="text-xs font-semibold text-stone-800 flex-1 truncate">{sc.name}</span>
                          {lc > 0 && <span className="text-[9px] text-indigo-700 font-bold flex-shrink-0">🔗{lc}</span>}
                          {soldOut ? <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-stone-200 text-stone-500 flex-shrink-0">소진 완료</span>
                            : <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 tabular-nums flex-shrink-0">{sc.used}/{sc.stockTotal}{sc.unit||''} 함</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
              {otherCourses.length > 0 && (
                <div>
                  <div className="text-xs font-bold text-rose-700 mb-2">➕ 다른 강좌 당겨 풀기 (오늘 안 깔린 거)</div>
                  <p className="text-[10px] text-stone-500 mb-2">진도형은 풀면 완강일이 자동으로 당겨져</p>
                  <div className="space-y-1.5">
                    {otherCourses.map(ec => {
                      const cfg = getSub(ec.subject);
                      const lc = linkCount(`${ec.courseId}:${date}`);
                      const tl = ec.type==='lesson'?'진도':ec.type==='quota'?'분량':'단발';
                      return (
                        <button key={ec.courseId} onClick={() => pickExtra(pickerFor, ec)}
                          className={`w-full flex items-center gap-2 p-2.5 rounded-lg border text-left ${cfg.bg} ${cfg.bd} hover:brightness-95`}>
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${cfg.ch} flex-shrink-0`}>{ec.subject}</span>
                          <span className="text-xs font-semibold text-stone-800 flex-1 truncate">{ec.text}</span>
                          {lc > 0 && <span className="text-[9px] text-indigo-700 font-bold flex-shrink-0">🔗{lc}</span>}
                          <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-stone-200 text-stone-600 flex-shrink-0">{tl}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
              {!hasAnyCandidate && (
                <div className="text-center py-8 text-stone-400">
                  <div className="text-3xl mb-2">🤷</div>
                  <div className="text-sm">선택할 할당 과제가 없어<br/>+ 직접으로 입력해 임마</div>
                </div>
              )}
            </div>
            <div className="border-t border-stone-200 p-3">
              <button onClick={() => setPickerFor(null)} className="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-lg text-sm font-bold">닫기</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  const submit = async () => {
    setMsg(null);
    if (!email || !password) { setMsg({ kind:'err', text:'이메일이랑 비번 입력해 임마' }); return; }
    if (mode === 'signup' && !name.trim()) { setMsg({ kind:'err', text:'이름도 입력해 야' }); return; }
    setBusy(true);
    try {
      if (mode === 'signup') {
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name: name.trim() } } });
        if (error) throw error;
        if (data.user && !data.session) {
          setMsg({ kind:'ok', text:'가입 완료. 메일 확인 후 로그인 ㄱㄱ' });
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      setMsg({ kind:'err', text: e.message || '뭔가 잘못됨' });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-stone-100 via-stone-50 to-rose-50 p-4">
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="text-5xl mb-2">📚</div>
          <h1 className="text-2xl font-black text-stone-800">패찍이</h1>
          <p className="text-xs text-stone-500 mt-1">너만의 공부 캘린더</p>
        </div>
        <div className="bg-white rounded-2xl border border-stone-200 shadow-lg p-5 space-y-3">
          <div className="flex gap-1 p-1 bg-stone-100 rounded-lg">
            <button onClick={()=>{setMode('login'); setMsg(null);}} className={`flex-1 py-2 rounded-md text-xs font-bold ${mode==='login'?'bg-white text-stone-900 shadow-sm':'text-stone-500'}`}>로그인</button>
            <button onClick={()=>{setMode('signup'); setMsg(null);}} className={`flex-1 py-2 rounded-md text-xs font-bold ${mode==='signup'?'bg-white text-stone-900 shadow-sm':'text-stone-500'}`}>가입</button>
          </div>
          {mode === 'signup' && (
            <div>
              <label className="block text-[11px] font-bold text-stone-600 mb-1">이름 (캘린더에 표시될 이름)</label>
              <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="예: 홍길동" className="w-full px-3 py-2.5 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rose-300" />
            </div>
          )}
          <div>
            <label className="block text-[11px] font-bold text-stone-600 mb-1">이메일</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" autoComplete="email" className="w-full px-3 py-2.5 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rose-300" />
          </div>
          <div>
            <label className="block text-[11px] font-bold text-stone-600 mb-1">비밀번호 (6자 이상)</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} autoComplete={mode==='login'?'current-password':'new-password'} onKeyDown={e=>{if(e.key==='Enter') submit();}} className="w-full px-3 py-2.5 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rose-300" />
          </div>
          {msg && <div className={`text-xs p-2.5 rounded-lg ${msg.kind==='err'?'bg-rose-50 text-rose-700 border border-rose-200':'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>{msg.text}</div>}
          <button onClick={submit} disabled={busy} className="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-sm font-bold disabled:bg-stone-300">
            {busy ? '처리중...' : (mode==='login' ? '로그인' : '가입하기')}
          </button>
          <p className="text-[10px] text-stone-400 text-center pt-1">
            {mode==='login' ? '계정 없으면 위에서 가입 클릭' : '이미 계정 있으면 로그인 클릭'}
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => { console.log('PWA 백그라운드 구동 준비 완료 (범위:', registration.scope, ')'); })
        .catch(error => { console.error('PWA 서비스 워커 등록 실패:', error); });
    });
  }
</script>
