const pd = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const weekDates = (a) => { const s = new Date(pd(a)); s.setDate(s.getDate()-s.getDay()); return Array.from({length:7},(_,i)=>fd(addD(s,i))); };

function buildSchedule(courses, holidays, config, checked) {
  const s = {};
  const all = daysBtw(config.startDate, config.endDate);
  const milestoneDates = new Set((config.milestones || []).map(m => m.date));
  for (const ds of all) {
    const isH = holidays.includes(ds);
    const isMileDay = milestoneDates.has(ds) && ds !== config.endDate;
    s[ds] = { wd:dowN(ds), special: isH?'🏖️ 휴일 · 전면 휴식':null, tasks:[], isHoliday:isH, isMileDay };
  }
  const sorted = [...courses].sort((a,b) => (a.sortOrder??99)-(b.sortOrder??99));
  
  for (const c of sorted) {
    if (c.type === 'custom') {
      const dates = c.customDates || [];
      for (const ds of dates) {
        if (!s[ds]) continue;
        if (s[ds].isMileDay) continue; // 시험날은 스킵, 휴일은 OK
        const tid = `${c.id}:${ds}`;
        s[ds].tasks.push({ 
          id:tid, courseId:c.id, subject:c.subject, 
          text:c.name, note:c.note, unit:c.unit || '', 
          target:1, type:'custom', carryable:!c.nonCarryable 
        });
      }
      continue;
    }
    
    if (c.type === 'lesson') {
      const perDay = Math.max(1, c.lessonsPerDay || 1);
      const total = c.totalLessons || 0;
      const startFrom = c.startFromDate || config.startDate;
      let currentLesson = c.doneLessons || 0;
      
      for (const ds of all) {
        if (ds < startFrom) continue;
        if (s[ds].isHoliday || s[ds].isMileDay) {
          // 휴일/시험날이라도 그날 당겨푼 게 있으면 진도 반영 (시간표서 당겨풀기)
          const tidH = `${c.id}:${ds}`;
          const aH = getVal(checked[tidH]);
          if (aH > 0 && currentLesson < total) currentLesson = Math.min(currentLesson + aH, total);
          continue;
        }
        
        const isAssignedDay = c.days.includes(dow(ds));
        const tid = `${c.id}:${ds}`;
        
        if (!isAssignedDay) {
          // 배정 요일 아님 → task 안 깔지만, 시간표서 당겨푼 checked가 있으면 진도만 당김
          const a = getVal(checked[tid]);
          if (a > 0 && currentLesson < total) currentLesson = Math.min(currentLesson + a, total);
          continue;
        }
        
        const start = currentLesson + 1;
        
        let text, target, isPost = false;
        
        if (start > total) {
          if (c.postCompleteText) {
            text = `${c.name} · ${c.postCompleteText}`;
            target = 1;
            isPost = true;
          } else {
            continue;
          }
        } else {
          const end = Math.min(start + perDay - 1, total);
          target = end - start + 1;
          if (target === 1) {
            text = `${c.name} ${start}${c.unit}`;
          } else {
            text = `${c.name} ${start}~${end}${c.unit}`;
          }
        }
        
        s[ds].tasks.push({ 
          id:tid, courseId:c.id, subject:c.subject, 
          text, note:c.note, unit:c.unit, 
          target, type:'lesson', carryable:!c.nonCarryable,
          isPostComplete: isPost,
        });
        
        if (!isPost) {
          const achieved = getVal(checked[tid]);
          const advance = Math.max(target, achieved);
          currentLesson = Math.min(currentLesson + advance, total);
        }
      }
      continue;
    }
    
    // quota type
    const startFromQ = c.startFromDate || config.startDate;
    for (const ds of all) {
      if (ds < startFromQ) continue;
      if (s[ds].isHoliday || s[ds].isMileDay) continue;
      if (!c.days.includes(dow(ds))) continue;
      const tid = `${c.id}:${ds}`;
      const target = c.dailyAmount || 1;
      s[ds].tasks.push({ 
        id:tid, courseId:c.id, subject:c.subject, 
        text:c.name, note:c.note, unit:c.unit, 
        target, type:'quota', carryable:!c.nonCarryable 
      });
    }
  }
  
  const first = config.startDate;
  if (s[first] && s[first].tasks.length > 0 && !s[first].special) {
    s[first].special = '🎯 시작일';
  }
  
  for (const m of (config.milestones || [])) {
    if (s[m.date] && m.date !== config.endDate) {
      s[m.date].special = `📝 ${m.name}`;
      s[m.date].isMilestone = true;
      s[m.date].milestoneInfo = m;
    }
  }
  
  if (s[config.endDate]) {
    s[config.endDate].special = `🚀 ${config.examName} D-DAY`;
    s[config.endDate].isExam = true;
    s[config.endDate].tasks = [{ id:'exam:day', courseId:'exam', subject:'기타', text:config.examName+' — 조져버리자', target:1, type:'lesson', carryable:false, unit:'' }];
  }
  return s;
}

function cStats(c, holidays, cfg, today, activeExamDate) {
  if (c.type === 'custom') {
    const dates = c.customDates || [];
    const future = dates.filter(d => pd(d) >= pd(today) && pd(d) <= pd(cfg.endDate));
    return { type:'custom', scheduled:dates.length, upcoming:future.length };
  }
  if (c.type === 'stock') {
    return { type:'stock', total:c.stockTotal || 0, stepUnit:c.stepUnit || 1 };
  }
  const tgt = activeExamDate || c.targetDate || cfg.endDate;
  const courseStart = c.startFromDate || cfg.startDate;
  const from = pd(today) > pd(courseStart) ? today : courseStart;
  const all = pd(from) <= pd(tgt) ? daysBtw(from, tgt) : [];
  let sd = 0;
  for (const ds of all) { if (holidays.includes(ds)) continue; if (c.days.includes(dow(ds))) sd++; }
  if (c.type === 'lesson') {
    const perDay = Math.max(1, c.lessonsPerDay || 1);
    const rem = Math.max(0, (c.totalLessons||0) - (c.doneLessons||0));
    const capacity = sd * perDay;
    const pace = sd > 0 ? rem/sd : 0;
    return { studyDays:sd, remaining:rem, pace, capacity, feasible:capacity >= rem, perDay };
  }
  return { studyDays:sd, total:sd * (c.dailyAmount||0) };
}

        } else {
          await sb.from('user_config').insert({
            user_id: user.id,
            exam_name: DEFAULT_CONFIG.examName,
            start_date: DEFAULT_CONFIG.startDate,
            end_date: DEFAULT_CONFIG.endDate,
            holidays: DEFAULT_CONFIG.holidays,
            milestones: DEFAULT_CONFIG.milestones,
            active_exam_id: DEFAULT_CONFIG.activeExamId,
          });
          cfg = { ...DEFAULT_CONFIG };
        }
        setConfig(cfg);
        
        const real = fd(new Date());
        if (real >= cfg.startDate && real <= cfg.endDate) {
          setToday(real); setAnchor(real);
        } else {
          setToday(cfg.startDate); setAnchor(cfg.startDate);
        }
        
        setCourses(coursesFromDb);
        
        const chR = await sb.from('task_checks').select('*').eq('user_id', user.id);
        if (chR.error) throw chR.error;
        if (chR.data) {
          const m = {};
          for (const r of chR.data) {
            const ca = r.updated_at ? r.updated_at.slice(0, 10) : r.task_date;
            m[`${r.course_id}:${r.task_date}`] = { v: r.achieved, ca };
          }
          setChecked(m);
        }
        
        // 시간표 로드
        try {
          const pR = await sb.from('daily_periods').select('*').eq('user_id', user.id);
          if (!pR.error && pR.data) {
            const pm = {};
            for (const r of pR.data) {
              if (!pm[r.period_date]) pm[r.period_date] = [];
              pm[r.period_date].push({ 
                id: r.id, no: r.period_no, subject: r.subject || '기타', 
                task: r.task || '', done: r.done, completedAt: r.completed_at,
                linkedTaskId: r.linked_task_id || null,
                slotOrder: r.slot_order || 0,
                qty: r.qty != null ? Number(r.qty) : null,
              });
            }
            for (const k of Object.keys(pm)) pm[k].sort((a,b) => a.no - b.no);
            setPeriods(pm);
          }
        } catch(e) { console.log('시간표 테이블 없음. SQL 만들어'); }
        
        setSyncStatus('ok');
      } catch (e) {
        console.error('동기화 실패:', e);
        setSyncStatus('err');
      } finally {
        setLoading(false);
      }
    })();
  }, [user]);

  const decideCA = (taskDate, forceToday = false) => {
    const todayStr = fd(new Date());
    if (forceToday) return todayStr;
    return pd(taskDate) < pd(todayStr) ? taskDate : todayStr;
  };

  const saveCheckDbWithCA = useCallback(async (cid, td, v, ca) => {
    if (!sb || !user || cid === 'exam' || !isUUID(cid)) return;
    try {
      if (v <= 0) {
        await sb.from('task_checks').delete().eq('course_id', cid).eq('task_date', td).eq('user_id', user.id);
      } else {
        const caIso = new Date(ca + 'T12:00:00').toISOString();
        await sb.from('task_checks').upsert({
          course_id: cid, task_date: td, achieved: v,
          updated_at: caIso, user_id: user.id,
        }, { onConflict: 'course_id,task_date,user_id' });
      }
    } catch (e) { console.error(e); }
  }, [user]);

  const toggleFull = (t, fromMissed = false) => {
    const [cid, td] = t.id.split(':');
    if (cid === 'exam') return;
    const ca = decideCA(td, fromMissed);
    setChecked(prev => {
      const cur = getVal(prev[t.id]);
      const nv = cur >= t.target ? 0 : t.target;
      saveCheckDbWithCA(cid, td, nv, ca);
      if (nv === 0) { const { [t.id]: _, ...rest } = prev; return rest; }
      return { ...prev, [t.id]: { v: nv, ca } };
    });
    const curVal = getVal(checked[t.id]);
    if (curVal < t.target) {
      setPopTaskId(t.id);
      setTimeout(() => setPopTaskId(null), 260);
    }
  };

  const adjust = (t, delta, fromMissed = false) => {
    const [cid, td] = t.id.split(':');
    if (cid === 'exam') return;
    const ca = decideCA(td, fromMissed);
    setChecked(prev => {
      const cur = getVal(prev[t.id]);
      const v = Math.max(0, cur + delta);
      saveCheckDbWithCA(cid, td, v, ca);
      if (v === 0) { const { [t.id]: _, ...rest } = prev; return rest; }
      return { ...prev, [t.id]: { v, ca } };
    });
  };

  const setVal = (tid, v, fromMissed = false) => {
    const [cid, td] = tid.split(':');
    const val = Math.max(0, v);
    const ca = decideCA(td, fromMissed);
    setChecked(prev => {
      saveCheckDbWithCA(cid, td, val, ca);
      if (val === 0) { const { [tid]: _, ...rest } = prev; return rest; }
      return { ...prev, [tid]: { v: val, ca } };
    });
  };

  const resetAll = async () => {
    if (!confirm('체크 기록 전부 초기화할거야?')) return;
    setChecked({});
    if (sb && user) { try { await sb.from('task_checks').delete().eq('user_id', user.id); } catch(e){} }
  };

  const saveCourse = async (form) => {
    try {
      if (form.isNew) {
        const { isNew, id, ...rest } = form;
        let created;
        if (sb && user) {
          const { data, error } = await sb.from('courses').insert({ ...toDb(rest), user_id: user.id }).select().single();
          if (error) throw error;
          created = fromDb(data);
        } else {
          created = { ...rest, id: 'local-' + Date.now() };
        }
        setCourses(prev => [...prev, created]);
      } else {
        let updated = form;
        if (sb && user) {
          const { data, error } = await sb.from('courses').update(toDb(form)).eq('id', form.id).eq('user_id', user.id).select().single();
          if (error) throw error;
          updated = fromDb(data);
        }
        setCourses(prev => prev.map(c => c.id === updated.id ? updated : c));
      }
      setEditing(null);
    } catch (e) { alert('저장 실패: ' + e.message); }
  };

  const deleteCourse = async (id) => {
    if (!confirm('이 강좌 삭제할거야? 체크 기록도 같이 날아가.')) return;
    if (sb && user) { try { await sb.from('courses').delete().eq('id', id).eq('user_id', user.id); } catch(e){} }
    setCourses(prev => prev.filter(c => c.id !== id));
    setChecked(prev => {
      const nc = { ...prev };
      for (const k of Object.keys(nc)) if (k.startsWith(`${id}:`)) delete nc[k];
      return nc;
    });
  };

  const toggleHoliday = async (ds) => {
    const next = config.holidays.includes(ds) ? config.holidays.filter(h=>h!==ds) : [...config.holidays, ds];
    const nc = { ...config, holidays: next };
    setConfig(nc);
    if (sb && user) { try { await sb.from('user_config').update({ holidays: next }).eq('user_id', user.id); } catch(e){} }
  };

  const updateConfig = async (c) => {
    setConfig(c);
    if (sb && user) { 
      try { 
        await sb.from('user_config').update({ 
          exam_name:c.examName, start_date:c.startDate, end_date:c.endDate, 
          holidays:c.holidays, milestones:c.milestones || [],
          active_exam_id: c.activeExamId || 'final',
        }).eq('user_id', user.id); 
      } catch(e){ console.error(e); } 
    }
  };

  const updateMilestones = async (newMilestones) => {
    const nc = { ...config, milestones: newMilestones };
    setConfig(nc);
    if (sb && user) {
      try { await sb.from('user_config').update({ milestones: newMilestones }).eq('user_id', user.id); }
      catch (e) { console.error(e); alert('milestones 저장 실패. SQL 컬럼 확인'); }
    }
  };

  const setActiveExam = async (examId) => {
    const nc = { ...config, activeExamId: examId };
    setConfig(nc);
    if (sb && user) {
      try { await sb.from('user_config').update({ active_exam_id: examId }).eq('user_id', user.id); }
      catch (e) { console.error(e); alert('활성 시험 저장 실패. SQL 컬럼 확인'); }
    }
  };

  const handleSignOut = async () => {
    if (!confirm('로그아웃 할거야?')) return;
    await sb.auth.signOut();
  };

  // 시간표: 항목마다 고유 id로 관리 (한 교시에 여러 개 가능)
  // 새 항목 추가 — 빈 칸이든 아니든 추가 즉시 INSERT해서 진짜 id 확보 (race 방지)
  const addPeriod = async (date, no, fields) => {
    const tmpId = 'tmp-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    const item = { id: tmpId, no, subject: '기타', task: '', done: false, linkedTaskId: null, completedAt: null, qty: null, ...fields };

    setPeriods(prev => {
      const newDate = [...(prev[date] || []), item];
      newDate.sort((a,b) => a.no - b.no);
      return { ...prev, [date]: newDate };
    });

    if (!sb || !user) return;
    try {
      const completedAt = item.done ? (item.completedAt || fd(new Date())) : null;
      const { data, error } = await sb.from('daily_periods').insert({
        user_id: user.id, period_date: date, period_no: no,
        subject: item.subject, task: item.task,
        done: item.done, completed_at: completedAt,
        linked_task_id: item.linkedTaskId || null,
        qty: item.qty != null ? item.qty : null,
      }).select().single();
      if (error) throw error;
      if (data) {
        const realId = data.id;
        delete pendingEdits.current[tmpId];
        // tmp id를 진짜 id로 교체
        setPeriods(prev => ({
          ...prev,
          [date]: (prev[date] || []).map(p => p.id === tmpId ? { ...p, id: realId } : p),
        }));
        // 한 틱 뒤, state에서 진짜 최신 항목을 읽어 무조건 UPDATE (subject/task/qty 전부 반영)
        await new Promise(r => setTimeout(r, 0));
        let latest = null;
        setPeriods(prev => {
          latest = (prev[date] || []).find(p => p.id === realId) || null;
          return prev;
        });
        if (latest) {
          try {
            await sb.from('daily_periods').update({
              subject: latest.subject, task: latest.task,
              done: latest.done, completed_at: latest.done ? (latest.completedAt || fd(new Date())) : null,
              linked_task_id: latest.linkedTaskId || null,
              qty: latest.qty != null ? latest.qty : null,
            }).eq('id', realId);
          } catch(e) { console.error(e); }
        }
      }
    } catch(e) { console.error(e); }
  };

  // id로 항목 수정
  const updatePeriod = async (date, id, fields) => {
    let merged = null;
    setPeriods(prev => {
      const newDate = (prev[date] || []).map(p => {
        if (p.id !== id) return p;
        merged = { ...p, ...fields };
        return merged;
      });
      return { ...prev, [date]: newDate };
    });
    if (!merged) return;
    if (!sb || !user) return;

    // tmp id면 아직 INSERT 진행 중 → 최신값 ref에 저장, addPeriod가 마무리
    if (String(id).startsWith('tmp-')) {
      pendingEdits.current[id] = {
        subject: merged.subject, task: merged.task, qty: merged.qty,
        done: merged.done, linkedTaskId: merged.linkedTaskId, completedAt: merged.completedAt,
      };
      return;
    }

    try {
      const completedAt = merged.done ? (merged.completedAt || fd(new Date())) : null;
      await sb.from('daily_periods').update({
        subject: merged.subject, task: merged.task,
        done: merged.done, completed_at: completedAt,
        linked_task_id: merged.linkedTaskId || null,
        qty: merged.qty != null ? merged.qty : null,
      }).eq('id', id);
    } catch(e) { console.error(e); }
  };

  // id로 항목 삭제
  const deletePeriod = async (date, id) => {
    setPeriods(prev => ({
      ...prev,
      [date]: (prev[date] || []).filter(p => p.id !== id),
    }));
    if (!sb || !user) return;
    if (String(id).startsWith('tmp-')) return;
    try { await sb.from('daily_periods').delete().eq('id', id); } catch(e) { console.error(e); }
  };

  // 연동 과제의 checked를, 그 과제에 연결된 done 항목들의 qty 합으로 다시 계산
  const recalcLinked = (date, linkedTaskId, overrides) => {
    if (!linkedTaskId || linkedTaskId.startsWith('stock:')) return;
    const td = linkedTaskId.split(':')[1];
    const [cid] = linkedTaskId.split(':');
    const course = courses.find(c => c.id === cid);
    const linked = schedule[td]?.tasks?.find(t => t.id === linkedTaskId);
    const qtyOf = (p) => {
      if (p.qty != null) return p.qty;
      if (linked) return linked.target;
      if (course) {
        const m = p.task.match(/(\d+)~(\d+)/);
        if (course.type === 'lesson' && m) return Number(m[2]) - Number(m[1]) + 1;
        if (course.type === 'quota') return course.dailyAmount || 1;
      }
      return 1;
    };
    const list = (periods[date] || []).map(p => {
      if (overrides && p.id === overrides.id) return { ...p, ...overrides };
      return p;
    });
    const sum = list
      .filter(p => p.linkedTaskId === linkedTaskId && p.done)
      .reduce((s, p) => s + qtyOf(p), 0);
    setVal(linkedTaskId, sum, td !== date);
  };

  const togglePeriodDone = (date, id) => {
    const cur = (periods[date] || []).find(p => p.id === id);
    if (!cur || !cur.task?.trim()) return;
    const newDone = !cur.done;
    if (cur.linkedTaskId) {
      recalcLinked(date, cur.linkedTaskId, { id, done: newDone });
    }
    updatePeriod(date, id, { done: newDone, completedAt: newDone ? fd(new Date()) : null });
  };

  // 수량 변경 (done 상태면 캘린더 즉시 재반영)
  const setPeriodQty = (date, id, qty) => {
    const cur = (periods[date] || []).find(p => p.id === id);
    updatePeriod(date, id, { qty });
    if (cur && cur.done && cur.linkedTaskId) {
      recalcLinked(date, cur.linkedTaskId, { id, qty });
    }
  };

  const schedule = useMemo(() => buildSchedule(courses, config.holidays, config, checked), [courses, config, checked]);
  const wd = useMemo(() => weekDates(anchor), [anchor]);

  const activeExam = useMemo(() => {
    const id = config.activeExamId || 'final';
    if (id === 'final') return { id: 'final', name: config.examName, date: config.endDate, isFinal: true };
    const m = (config.milestones || []).find(x => x.id === id);
    if (m) return { ...m, isFinal: false };
    return { id: 'final', name: config.examName, date: config.endDate, isFinal: true };
  }, [config]);
  
  const allDates = useMemo(() => 
    Object.keys(schedule).filter(ds => ds <= activeExam.date).sort(), 
    [schedule, activeExam]
  );
  
  const allExams = useMemo(() => {
    return [
      ...((config.milestones || []).map(m => ({ ...m, isFinal: false }))),
      { id: 'final', name: config.examName, date: config.endDate, isFinal: true },
    ].sort((a, b) => a.date.localeCompare(b.date));
  }, [config]);

  const upcomingExams = useMemo(() => allExams.filter(e => pd(e.date) >= pd(today)), [allExams, today]);

  const missed = useMemo(() => {
    const out = [];
    for (const ds of allDates) {
      if (pd(ds) >= pd(today)) break;
      const d = schedule[ds];
      if (!d || d.isHoliday) continue;
      for (const t of d.tasks) {
        if (!t.carryable) continue;
        if (t.type === 'quota') continue; 
        if (t.type === 'custom') continue; 
        if (t.courseId === 'exam') continue;
        if (t.isPostComplete) continue;
        const v = getVal(checked[t.id]);
        if (v < t.target) out.push({ ...t, originalDate: ds });
      }
    }
    return out;
  }, [schedule, checked, today, allDates]);

  const stats = useMemo(() => {
    let total = 0, done = 0;
    const bySub = {};
    for (const ds of allDates) {
      for (const t of schedule[ds].tasks) {
        if (t.courseId === 'exam') continue;
        const d = normDone(getVal(checked[t.id]), t.target);
        total += 1; done += d;
        if (!bySub[t.subject]) bySub[t.subject] = { total:0, done:0 };
        bySub[t.subject].total += 1;
        bySub[t.subject].done += d;
      }
    }
    return { total, done, bySub };
  }, [schedule, checked, allDates]);

  const dL = dDay(today, activeExam.date);
  const [ws, we] = [wd[0], wd[6]];
  const pastDates = wd.filter(ds => pd(ds) < pd(today));
  const currentDates = wd.filter(ds => pd(ds) >= pd(today));

  if (authLoading || (sb && user && loading)) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-50">
        <div className="text-center">
          <div className="text-4xl mb-3">📚</div>
          <div className="text-sm text-stone-500 font-semibold">로딩중...</div>
        </div>
      </div>
    );
  }

  if (sb && !user) {
    return <AuthScreen />;
  }

  return (
    <div className="min-h-screen bg-stone-50 text-stone-800">
      <header className="bg-gradient-to-br from-stone-900 via-stone-800 to-stone-900 text-stone-100 sticky top-0 z-20 shadow-lg">
        <div className="max-w-3xl mx-auto px-4 py-4">
          <div className="flex items-center justify-between">
            <div>
              <div className="flex items-center gap-2 text-[11px] tracking-widest text-stone-400 uppercase">
                <Target className="w-3 h-3" /><span>{displayName}</span>
              </div>
              <h1 className="text-xl font-bold mt-0.5">밀착관리 캘린더</h1>
            </div>
            <div className="text-right">
              <div className="text-[10px] text-stone-400 uppercase tracking-widest">{activeExam.name}까지</div>
              <div className="text-2xl font-black text-rose-400 tabular-nums">D-{dL}</div>
            </div>
          </div>

          <div className="mt-3 flex gap-1 p-1 bg-stone-700/40 rounded-lg overflow-x-auto">
            {allExams.map(e => (
              <button key={e.id} onClick={() => setActiveExam(e.id)}
                className={`flex-shrink-0 px-3 py-1.5 rounded-md text-[11px] font-bold transition-colors ${config.activeExamId === e.id ? 'bg-amber-400 text-stone-900' : 'text-stone-300 hover:text-white'}`}>
                {e.isFinal ? '🚀' : '📝'} {e.name}대비
              </button>
            ))}
          </div>

          <div className="mt-3">
            <div className="flex justify-between text-xs text-stone-400 mb-1">
              <span>전체 진도</span>
              <span className="tabular-nums">{Math.round(stats.done)} / {stats.total} ({Math.round(stats.done/(stats.total||1)*100)}%)</span>
            </div>
            <div className="h-2 bg-stone-700 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-rose-500 via-fuchsia-500 to-amber-400 transition-all duration-500"
                style={{ width: `${stats.total ? stats.done/stats.total*100 : 0}%` }} />
            </div>
          </div>

          <div className="mt-3 flex gap-1 p-1 bg-stone-700/50 rounded-lg">
            <button onClick={() => setView('calendar')}
              className={`flex-1 flex items-center justify-center gap-1 py-2 rounded-md text-[11px] font-bold transition-colors ${view==='calendar'?'bg-white text-stone-900':'text-stone-300'}`}>
              <Cal className="w-3.5 h-3.5" />캘린더
            </button>
            <button onClick={() => setView('timetable')}
              className={`flex-1 flex items-center justify-center gap-1 py-2 rounded-md text-[11px] font-bold transition-colors ${view==='timetable'?'bg-white text-stone-900':'text-stone-300'}`}>
              <Pencil className="w-3.5 h-3.5" />시간표
            </button>
            <button onClick={() => setView('achievement')}
              className={`flex-1 flex items-center justify-center gap-1 py-2 rounded-md text-[11px] font-bold transition-colors ${view==='achievement'?'bg-white text-stone-900':'text-stone-300'}`}>
              <Trophy className="w-3.5 h-3.5" />달성
            </button>
            <button onClick={() => setView('courses')}
              className={`flex-1 flex items-center justify-center gap-1 py-2 rounded-md text-[11px] font-bold transition-colors ${view==='courses'?'bg-white text-stone-900':'text-stone-300'}`}>
              <Book className="w-3.5 h-3.5" />강좌
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-3xl mx-auto px-4 py-5 pb-24">
        {view === 'calendar' && (
          <div className="fade-in">
            {upcomingExams.length > 0 && (
              <section className="mb-4">
                <div className="flex items-center gap-2 mb-2">
                  <Cal className="w-4 h-4 text-stone-600" />
                  <h2 className="text-sm font-bold text-stone-700">다가오는 시험</h2>
                </div>
                <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
                  {upcomingExams.map(e => {
                    const d = dDay(today, e.date);
                    return (
                      <button onClick={() => { setAnchor(e.date); setExpandedPast(false); }} key={e.id}
                        className={`flex-shrink-0 px-3 py-2 rounded-xl border-2 text-left ${e.isFinal?'bg-gradient-to-br from-rose-500 to-red-500 text-white border-rose-500':'bg-white border-amber-300'}`}>
                        <div className={`text-[10px] font-bold ${e.isFinal?'opacity-90':'text-amber-700'}`}>{e.name}</div>
                        <div className={`text-lg font-black tabular-nums ${e.isFinal?'':'text-amber-900'}`}>D-{d}</div>
                        <div className={`text-[10px] tabular-nums ${e.isFinal?'opacity-80':'text-stone-500'}`}>{e.date.slice(5).replace('-','/')} ({dowN(e.date)})</div>
                      </button>
                    );
                  })}
                </div>
              </section>
            )}
            
            <section className="mb-5">
              <div className="flex items-center gap-2 mb-3">
                <Trending className="w-4 h-4 text-stone-600" />
                <h2 className="text-sm font-bold text-stone-700">과목별 진도</h2>
              </div>
              <div className="grid grid-cols-2 gap-2">
                {Object.entries(stats.bySub).sort((a,b)=>b[1].total-a[1].total).map(([sub, st]) => {
                  if (!st.total) return null;
                  const pct = Math.round(st.done/st.total*100);
                  const cfg = getSub(sub);
                  return (
                    <div key={sub} className={`${cfg.bg} ${cfg.bd} border rounded-xl p-3`}>
                      <div className="flex justify-between items-baseline mb-1.5">
                        <span className={`text-xs font-bold ${cfg.c}`}>{sub}</span>
                        <span className="text-[11px] text-stone-500 tabular-nums">{Math.round(st.done)}/{st.total}</span>
                      </div>
                      <div className="h-1.5 bg-white/60 rounded-full overflow-hidden">
                        <div className={`h-full ${cfg.br} transition-all duration-500`} style={{width:`${pct}%`}} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            <section className="mb-4">
              <div className="flex items-center justify-between gap-2 bg-white rounded-xl border border-stone-200 p-2 shadow-sm">
                <button onClick={() => { const p = fd(addD(pd(ws),-1)); if (pd(p) >= pd(allDates[0])) { setAnchor(p); setExpandedPast(false); } }}
                  disabled={pd(ws) <= pd(allDates[0])}
                  className="p-2 rounded-lg hover:bg-stone-100 disabled:opacity-30">
                  <ChevronLeft className="w-5 h-5" />
                </button>
                <div className="flex-1 text-center">
                  <div className="text-[11px] text-stone-500">이번 주</div>
                  <div className="text-sm font-bold tabular-nums">{ws.slice(5).replace('-','/')} ~ {we.slice(5).replace('-','/')}</div>
                </div>
                <button onClick={() => { setAnchor(today); setExpandedPast(false); }}
                  className="text-xs px-3 py-1.5 bg-stone-800 text-white rounded-lg font-semibold hover:bg-stone-700">오늘</button>
                <button onClick={() => { const n = fd(addD(pd(we),1)); if (pd(n) <= pd(allDates[allDates.length-1])) { setAnchor(n); setExpandedPast(false); } }}
                  disabled={pd(we) >= pd(allDates[allDates.length-1])}
                  className="p-2 rounded-lg hover:bg-stone-100 disabled:opacity-30">
                  <ChevronRight className="w-5 h-5" />
                </button>
              </div>
            </section>

            {pastDates.length > 0 && (
              <section className="mb-3">
                <button onClick={() => setExpandedPast(!expandedPast)}
                  className="w-full flex items-center justify-between gap-2 bg-white rounded-xl border border-stone-200 p-3 shadow-sm hover:bg-stone-50">
                  <div className="flex items-center gap-2">
                    <ChevronDown className={`w-4 h-4 text-stone-400 transition-transform ${expandedPast?'rotate-180':''}`} />
                    <span className="text-xs font-bold text-stone-500">
                      지난 날짜 {pastDates.length}일 ({pastDates[0].slice(5).replace('-','/')}~{pastDates[pastDates.length-1].slice(5).replace('-','/')})
                    </span>
                  </div>
                  {!expandedPast && (
                    <div className="flex gap-1">
                      {pastDates.map(ds => (
                        <span key={ds} className="text-[10px] text-stone-400 tabular-nums">{Number(ds.slice(8))}{dowN(ds)}</span>
                      ))}
                    </div>
                  )}
                </button>
                
                {expandedPast && (
                  <div className="space-y-3 mt-3">
                    {pastDates.map((ds) => <DayCard key={ds} ds={ds} schedule={schedule} today={today} checked={checked} periods={periods} missed={[]} showMissed={false} onToggle={toggleFull} onAdjust={adjust} onQuickEdit={setQuickEdit} popTaskId={popTaskId} />)}
                  </div>
                )}
              </section>
            )}

            <section className="space-y-3">
              {currentDates.map((ds) => {
                const isToday = ds === today;
                const showMissed = isToday && missed.length > 0;
                return (
                  <DayCard key={ds} ds={ds} schedule={schedule} today={today} checked={checked} periods={periods}
                    missed={showMissed ? missed : []} showMissed={showMissed}
                    onToggle={toggleFull} onAdjust={adjust} onQuickEdit={setQuickEdit} popTaskId={popTaskId} />
                );
              })}
            </section>
          </div>
        )}

        {view === 'timetable' && (
          <div className="fade-in">
            <Timetable today={today} periods={periods} onAdd={addPeriod} onUpdate={updatePeriod} onDelete={deletePeriod} onToggle={togglePeriodDone} onSetQty={setPeriodQty}
              schedule={schedule} checked={checked} missed={missed} onTaskCheck={toggleFull} courses={courses} />
          </div>
        )}

        {view === 'achievement' && (
          <div className="fade-in">
            <Achievement courses={courses} checked={checked} config={config} today={today} schedule={schedule} periods={periods} />
          </div>
        )}

        {view === 'courses' && (
          <div className="fade-in">
            <Courses courses={courses} config={config} today={today} activeExamDate={activeExam.date} periods={periods}
              onEdit={setEditing} onDel={deleteCourse}
              onAdd={() => setEditing({ isNew:true, id:null, name:'', subject:'국어', type:'lesson', totalLessons:10, doneLessons:0, lessonsPerDay:1, unit:'강', targetDate:config.endDate, startFromDate:today, days:[1,2,3,4], note:'' })}
              onTogH={toggleHoliday} updCfg={updateConfig} updMilestones={updateMilestones} />
          </div>
        )}

        <div className="mt-8 text-center space-y-2">
          <div className="text-[10px] text-stone-400">
            {!HAS_SUPABASE && '⚠️ 로컬 저장 (Supabase 연결 안 됨)'}
            {HAS_SUPABASE && syncStatus==='ok' && `✅ ${displayName}으로 로그인됨`}
            {HAS_SUPABASE && syncStatus==='syncing' && '⏳ 동기화 중...'}
            {HAS_SUPABASE && syncStatus==='err' && '⚠️ DB 연결 실패'}
          </div>
          <div className="flex items-center justify-center gap-3">
            <button onClick={resetAll} className="inline-flex items-center gap-1.5 text-xs text-stone-400 hover:text-rose-500">
              <Reset className="w-3 h-3" />체크 기록 초기화
            </button>
            {user && (
              <button onClick={handleSignOut} className="inline-flex items-center gap-1.5 text-xs text-stone-400 hover:text-rose-500">
                로그아웃
              </button>
            )}
          </div>
        </div>
      </main>

      {editing && <CourseForm course={editing} onSave={saveCourse} onClose={()=>setEditing(null)} holidays={config.holidays} config={config} today={today} />}
      {quickEdit && <QuickEdit task={quickEdit} cur={getVal(checked[quickEdit.id])} onSet={v=>setVal(quickEdit.id,v, quickEdit._fromMissed)} onClose={()=>setQuickEdit(null)} />}
    </div>
  );
}function Achievement({ courses, checked, config, today, schedule, periods }) {
  const achievements = useMemo(() => {
    const byDate = {};
    const allDates = daysBtw(config.startDate, config.endDate);
    for (const ds of allDates) {
      const day = schedule[ds];
      if (!day) continue;
      byDate[ds] = { total: 0, done: 0, doneOnDate: 0, effortOnDate: 0, periodDone: 0, tasks: [] };
      for (const t of day.tasks) {
        if (t.courseId === 'exam') continue;
        byDate[ds].total += 1; 
        byDate[ds].tasks.push(t);
      }
    }
    for (const [tid, v] of Object.entries(checked)) {
      const val = getVal(v);
      const ca = getCA(v);
      if (val <= 0) continue;
      const [cid, td] = tid.split(':');
      if (cid === 'exam') continue;
      let taskTarget = 1;
      if (schedule[td]) {
        const t = schedule[td].tasks.find(x => x.id === tid);
        if (t) taskTarget = t.target;
      }
      const cappedDone = normDone(val, taskTarget);
      const rawEffort = val / Math.max(taskTarget, 1);
      if (byDate[td]) byDate[td].done += cappedDone;
      const workedDate = (ca && ca !== td) ? ca : td;
      if (byDate[workedDate]) {
        byDate[workedDate].doneOnDate += cappedDone;
        byDate[workedDate].effortOnDate += rawEffort;
      }
    }
    // 시간표 달성 반영 (연동 과제는 checked에서 이미 집계됨 → 자유입력/비축형만)
    if (periods) {
      for (const [date, list] of Object.entries(periods)) {
        for (const p of list) {
          if (!p.done) continue;
          // 일반 과제 연동(courseId:date)은 원본이 위에서 이미 카운트됨 → 스킵. 자유입력(연동X)·비축형(stock:)만 반영
          if (p.linkedTaskId && !p.linkedTaskId.startsWith('stock:')) continue;
          const workedDate = p.completedAt || date;
          if (!byDate[workedDate]) byDate[workedDate] = { total:0, done:0, doneOnDate:0, effortOnDate:0, periodDone:0, tasks:[] };
          byDate[workedDate].effortOnDate += 1;
          byDate[workedDate].periodDone += 1;
        }
      }
    }
    return byDate;
  }, [checked, schedule, config, periods]);

  const getIntensity = (ds) => {
    const d = achievements[ds];
    if (!d || d.effortOnDate < 0.1) return 0;
    if (d.effortOnDate < 2) return 1;
    if (d.effortOnDate < 4) return 2;
    if (d.effortOnDate < 6) return 3;
    return 4;
  };

  const overallStats = useMemo(() => {
    let totalDone = 0, totalTarget = 0, perfectDays = 0, studyDays = 0, streakBest = 0;
    const today_date = pd(today);
    const allDatesArr = daysBtw(config.startDate, today).filter(d => pd(d) <= today_date);
    let currentStreak = 0;
    for (let i = allDatesArr.length - 1; i >= 0; i--) {
      const ds = allDatesArr[i];
      const d = achievements[ds];
      if (!d) continue;
      if (d.total === 0) continue;
      studyDays++;
      totalDone += d.done;
      totalTarget += d.total;
      if (d.done >= d.total - 0.001) perfectDays++;
      if (d.effortOnDate > 0.001 || d.done >= d.total - 0.001) {
        currentStreak++;
        streakBest = Math.max(streakBest, currentStreak);
      } else {
        currentStreak = 0;
      }
    }
    let s = 0;
    for (let i = allDatesArr.length - 1; i >= 0; i--) {
      const ds = allDatesArr[i];
      const d = achievements[ds];
      if (!d || d.total === 0) continue;
      if (d.done >= d.total - 0.001 || d.effortOnDate > 0.001) s++;
      else { if (i === allDatesArr.length - 1) continue; break; }
    }
    const streakCur = s;
    return { totalDone, totalTarget, perfectDays, studyDays, streakCur, streakBest };
  }, [achievements, today, config]);

  const subjectTotals = useMemo(() => {
    const m = {};
    for (const [tid, v] of Object.entries(checked)) {
      const val = getVal(v);
      if (val <= 0) continue;
      const [cid, td] = tid.split(':');
      const course = courses.find(c => c.id === cid);
      if (!course) continue;
      if (!m[course.subject]) m[course.subject] = 0;
      m[course.subject] += val;
    }
    return m;
  }, [checked, courses]);

  // 시간표 누적 달성 (자유입력 + 비축형, 완료된 것만)
  const ttStats = useMemo(() => {
    let count = 0;
    const bySub = {};
    for (const list of Object.values(periods || {})) {
      for (const p of list) {
        if (!p.done) continue;
        if (p.linkedTaskId && !p.linkedTaskId.startsWith('stock:')) continue; // 일반 연동은 위 과목별 누적에 이미 포함
        count++;
        const sub = p.subject || '기타';
        bySub[sub] = (bySub[sub] || 0) + 1;
      }
    }
    return { count, bySub };
  }, [periods]);

  const allDates = daysBtw(config.startDate, config.endDate);
  const startDow = pd(config.startDate).getDay();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (const ds of allDates) cells.push(ds);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  const DOW = ['일','월','화','수','목','금','토'];
  const today_date = pd(today);
  const startDate = pd(config.startDate);
  const daysSinceStart = Math.max(1, Math.min(Math.floor((today_date - startDate) / 86400000) + 1, allDates.length));
  const pct = overallStats.totalTarget ? Math.round(overallStats.totalDone/overallStats.totalTarget*100) : 0;

  return (
    <>
      <div className="relative overflow-hidden bg-gradient-to-br from-amber-500 via-orange-500 to-rose-500 rounded-2xl p-5 text-white shadow-lg mb-4">
        <div className="absolute top-0 right-0 opacity-10"><Trophy className="w-32 h-32" /></div>
        <div className="relative">
          <div className="flex items-center gap-2 mb-1">
            <Trophy className="w-5 h-5" />
            <h2 className="text-sm font-bold uppercase tracking-wider">Your Journey</h2>
          </div>
          <div className="text-4xl font-black tabular-nums mb-1">{pct}%</div>
          <div className="text-xs opacity-90 tabular-nums">
            {Math.round(overallStats.totalDone)} / {overallStats.totalTarget} 과업 완료 · {daysSinceStart}일차
          </div>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-2 mb-5">
        <StatCard icon={<Flame className="w-4 h-4" />} label="현재 연속" value={overallStats.streakCur} unit="일" color="bg-gradient-to-br from-rose-500 to-orange-500"/>
        <StatCard icon={<Award className="w-4 h-4" />} label="최장 연속" value={overallStats.streakBest} unit="일" color="bg-gradient-to-br from-amber-500 to-yellow-500"/>
        <StatCard icon={<Check className="w-4 h-4" />} label="완벽한 날" value={overallStats.perfectDays} unit="일" color="bg-gradient-to-br from-emerald-500 to-teal-500"/>
      </div>

      <section className="bg-white rounded-2xl border border-stone-200 shadow-sm p-4 mb-4">
        <div className="flex items-center justify-between mb-3">
          <div>
            <h3 className="text-sm font-bold text-stone-800">📅 달성 히트맵</h3>
            <p className="text-[10px] text-stone-500 mt-0.5">진하게 물든 날 = 많이 해낸 날</p>
          </div>
          <div className="flex items-center gap-1">
            <span className="text-[9px] text-stone-400">적음</span>
            {[0,1,2,3,4].map(i => (
              <div key={i} className={`w-2.5 h-2.5 rounded-sm ${
                i === 0 ? 'bg-stone-100' : i === 1 ? 'bg-emerald-200' : i === 2 ? 'bg-emerald-400' : i === 3 ? 'bg-emerald-600' : 'bg-emerald-800'
              }`}></div>
            ))}
            <span className="text-[9px] text-stone-400">많음</span>
          </div>
        </div>
        <div className="overflow-x-auto -mx-2 px-2">
          <div className="inline-flex gap-0.5 pb-1">
            <div className="flex flex-col gap-0.5 pr-1 pt-3">
              {DOW.map((d, i) => (
                <div key={d} className="w-3 h-3 flex items-center justify-center text-[8px] text-stone-400">
                  {i % 2 === 1 ? d : ''}
                </div>
              ))}
            </div>
            {weeks.map((week, wi) => {
              const firstDs = week.find(d => d);
              const showMonth = firstDs && (wi === 0 || (week[0] && Number(week[0].slice(8)) <= 7));
              return (
                <div key={wi} className="flex flex-col gap-0.5">
                  <div className="h-2.5 text-[8px] text-stone-400 tabular-nums">
                    {showMonth && firstDs ? `${Number(firstDs.slice(5,7))}월` : ''}
                  </div>
                  {DOW.map((_, di) => {
                    const ds = week[di];
                    if (!ds) return <div key={di} className="w-3 h-3"></div>;
                    const intensity = getIntensity(ds);
                    const isToday = ds === today;
                    const isFuture = pd(ds) > today_date;
                    const isHoliday = config.holidays.includes(ds);
                    let bg = 'bg-stone-100';
                    if (isFuture) bg = 'bg-stone-50';
                    else if (isHoliday) bg = 'bg-amber-100';
                    else if (intensity === 1) bg = 'bg-emerald-200';
                    else if (intensity === 2) bg = 'bg-emerald-400';
                    else if (intensity === 3) bg = 'bg-emerald-600';
                    else if (intensity === 4) bg = 'bg-emerald-800';
                    return <div key={di} className={`heat-cell w-3 h-3 rounded-sm ${bg} ${isToday ? 'ring-2 ring-rose-400 ring-offset-1' : ''}`} />;
                  })}
                </div>
              );
            })}
          </div>
        </div>
      </section>

      <MonthCalendar achievements={achievements} config={config} today={today} checked={checked} courses={courses} schedule={schedule} />

      {Object.keys(subjectTotals).length > 0 && (
        <section className="mt-4 bg-white rounded-2xl border border-stone-200 shadow-sm p-4">
          <h3 className="text-sm font-bold text-stone-800 mb-3">🎯 과목별 누적 달성</h3>
          <div className="space-y-2">
            {Object.entries(subjectTotals).sort((a,b) => b[1] - a[1]).map(([sub, cnt]) => {
              const cfg = getSub(sub);
              return (
                <div key={sub} className="flex items-center gap-2">
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${cfg.ch} w-20 text-center`}>{sub}</span>
                  <div className="flex-1 h-6 bg-stone-100 rounded-md overflow-hidden relative">
                    <div className={`h-full ${cfg.br} transition-all duration-500`} style={{width: `${Math.min(100, cnt / (Math.max(...Object.values(subjectTotals)) || 1) * 100)}%`}} />
                    <span className="absolute inset-0 flex items-center justify-end pr-2 text-xs font-bold tabular-nums text-stone-700">{cnt}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      )}

      {ttStats.count > 0 && (
        <section className="mt-4 bg-white rounded-2xl border border-indigo-200 shadow-sm p-4">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-stone-800">📝 시간표 누적 달성</h3>
            <span className="text-xs font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-700 tabular-nums">총 {ttStats.count}개</span>
          </div>
          <p className="text-[10px] text-stone-500 mb-3">시간표에서 자유입력·비축형으로 완료한 것 (할당 과제는 위 과목별 누적에 포함됨)</p>
          <div className="space-y-2">
            {Object.entries(ttStats.bySub).sort((a,b) => b[1] - a[1]).map(([sub, cnt]) => {
              const cfg = getSub(sub);
              const max = Math.max(...Object.values(ttStats.bySub)) || 1;
              return (
                <div key={sub} className="flex items-center gap-2">
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${cfg.ch} w-20 text-center`}>{sub}</span>
                  <div className="flex-1 h-6 bg-stone-100 rounded-md overflow-hidden relative">
                    <div className={`h-full ${cfg.br} transition-all duration-500`} style={{width: `${Math.min(100, cnt / max * 100)}%`}} />
                    <span className="absolute inset-0 flex items-center justify-end pr-2 text-xs font-bold tabular-nums text-stone-700">{cnt}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      )}

      <div className="mt-5 text-center">
        {pct >= 80 ? <div className="text-base font-bold text-rose-600">🔥 미쳤다 이 페이스! 조져버리자</div>
        : pct >= 50 ? <div className="text-base font-bold text-amber-600">💪 절반 넘었다! 계속 가자</div>
        : pct >= 20 ? <div className="text-base font-bold text-emerald-600">🌱 뿌리 내리는 중 · 꾸준히 가자</div>
        : <div className="text-base font-bold text-stone-600">🎯 시작이 반! 한 걸음씩 ㄱㄱ</div>}
      </div>
    </>
  );
}

function StatCard({ icon, label, value, unit, color }) {
  return (
    <div className={`${color} rounded-xl p-3 text-white shadow-sm`}>
      <div className="flex items-center gap-1 mb-1 opacity-90">
        {icon}
        <span className="text-[10px] font-bold uppercase tracking-wider">{label}</span>
      </div>
      <div className="flex items-baseline gap-1">
        <span className="text-2xl font-black tabular-nums">{value}</span>
        <span className="text-xs opacity-80">{unit}</span>
      </div>
    </div>
  );
}

function MonthCalendar({ achievements, config, today, checked, courses, schedule }) {
  const [viewMonth, setViewMonth] = useState(() => {
    const d = pd(today);
    return { y: d.getFullYear(), m: d.getMonth() };
  });
  const [selectedDate, setSelectedDate] = useState(null);
  const monthStart = new Date(viewMonth.y, viewMonth.m, 1);
  const monthEnd = new Date(viewMonth.y, viewMonth.m + 1, 0);
  const startDOW = monthStart.getDay();
  const daysInMonth = monthEnd.getDate();
  const cells = [];
  for (let i = 0; i < startDOW; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const DOW = ['일','월','화','수','목','금','토'];
  const today_date = pd(today);
  const milestoneDates = new Set((config.milestones || []).map(m => m.date));
  
  return (
    <section className="bg-white rounded-2xl border border-stone-200 shadow-sm p-4">
      <div className="flex items-center justify-between mb-3">
        <div>
          <h3 className="text-sm font-bold text-stone-800">🗓️ 월별 달성</h3>
          <p className="text-[10px] text-stone-500 mt-0.5">날짜 탭하면 상세 보이기</p>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setViewMonth(v => { const d = new Date(v.y, v.m - 1, 1); return { y: d.getFullYear(), m: d.getMonth() }; })} className="p-1 hover:bg-stone-100 rounded">
            <ChevronLeft className="w-4 h-4" />
          </button>
          <div className="text-xs font-bold tabular-nums">{viewMonth.y}.{String(viewMonth.m + 1).padStart(2,'0')}</div>
          <button onClick={() => setViewMonth(v => { const d = new Date(v.y, v.m + 1, 1); return { y: d.getFullYear(), m: d.getMonth() }; })} className="p-1 hover:bg-stone-100 rounded">
            <ChevronRight className="w-4 h-4" />
          </button>
        </div>
      </div>
      <div className="grid grid-cols-7 gap-1 mb-2">
        {DOW.map((d, i) => (
          <div key={d} className={`text-center text-[10px] font-bold py-1 ${i===0?'text-rose-500':i===6?'text-sky-500':'text-stone-500'}`}>{d}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {cells.map((day, i) => {
          if (day === null) return <div key={`e${i}`} className="aspect-square"></div>;
          const ds = fd(new Date(viewMonth.y, viewMonth.m, day));
          const a = achievements[ds];
          const isToday = ds === today;
          const isFuture = pd(ds) > today_date;
          const isHoliday = config.holidays.includes(ds);
          const isFinal = ds === config.endDate;
          const isMilestone = milestoneDates.has(ds);
          const hasData = a && a.total > 0;
          const perfect = hasData && a.done >= a.total - 0.001;
          const pct = hasData ? Math.round(a.done/a.total*100) : 0;
          const hasMakeup = a && a.effortOnDate > (hasData ? a.total : 0.001) + 0.001;
          const dowIdx = new Date(viewMonth.y, viewMonth.m, day).getDay();
          const clickable = !isFuture; 
          return (
            <button key={ds} onClick={() => clickable && setSelectedDate(ds)} disabled={!clickable}
              className={`aspect-square rounded-lg border relative flex flex-col items-center justify-center text-xs transition-colors
              ${isToday ? 'ring-2 ring-rose-400 border-rose-300' : 'border-stone-200'}
              ${isFinal ? 'bg-rose-100' : isMilestone ? 'bg-amber-50 border-amber-300' : isHoliday ? 'bg-amber-50' : isFuture ? 'bg-stone-50' : perfect ? 'bg-emerald-100 hover:bg-emerald-200' : pct >= 50 ? 'bg-emerald-50 hover:bg-emerald-100' : pct > 0 ? 'bg-amber-50 hover:bg-amber-100' : hasData ? 'bg-stone-50 hover:bg-stone-100' : 'bg-white hover:bg-stone-50'}
              ${!clickable ? 'cursor-default' : 'cursor-pointer'}`}>
              <div className={`font-semibold tabular-nums ${dowIdx === 0 ? 'text-rose-600' : dowIdx === 6 ? 'text-sky-600' : 'text-stone-700'} ${isFuture && !isFinal && !isMilestone ? 'opacity-40' : ''}`}>{day}</div>
              {hasData && !isFuture && <div className="text-[8px] tabular-nums font-bold">{perfect ? '✓' : pct > 0 ? `${pct}%` : ''}</div>}
              {hasMakeup && !isFuture && <div className="absolute -top-0.5 -right-0.5 text-[8px]">🔥</div>}
              {isHoliday && !isMilestone && !isFinal && <div className="absolute top-0.5 right-0.5 text-[8px]">🏖</div>}
              {isMilestone && <div className="absolute top-0.5 right-0.5 text-[8px]">📝</div>}
              {isFinal && <div className="absolute top-0.5 right-0.5 text-[8px]">🚀</div>}
            </button>
          );
        })}
      </div>
      <div className="mt-3 flex items-center justify-center flex-wrap gap-3 text-[10px] text-stone-500">
        <span className="flex items-center gap-1"><div className="w-3 h-3 bg-emerald-100 rounded"></div>완료</span>
        <span className="flex items-center gap-1"><div className="w-3 h-3 bg-emerald-50 rounded"></div>50%+</span>
        <span className="flex items-center gap-1"><div className="w-3 h-3 bg-amber-50 rounded"></div>일부</span>
        <span className="flex items-center gap-1">📝 시험</span>
        <span className="flex items-center gap-1">🔥 만회/초과</span>
      </div>
      {selectedDate && <DayDetailModal date={selectedDate} onClose={() => setSelectedDate(null)} checked={checked} courses={courses} schedule={schedule} config={config}/>}
    </section>
  );
}

function DayDetailModal({ date, onClose, checked, courses, schedule, config }) {
  const day = schedule[date];
  const isHoliday = config.holidays.includes(date);
  const wd = dowN(date);
  const milestone = (config.milestones || []).find(m => m.date === date);
  const isFinal = date === config.endDate;
  const scheduledTasks = day ? day.tasks.filter(t => t.courseId !== 'exam') : [];
  const scheduledResults = scheduledTasks.map(t => {
    const v = getVal(checked[t.id]);
    const ca = getCA(checked[t.id]);
    return { ...t, achieved: v, completedAt: ca,
      status: v >= t.target ? (v > t.target ? 'over' : 'done') : v > 0 ? 'partial' : 'missed',
      doneOnDate: !ca || ca === date };
  });
  const completedOnThisDate = [];
  for (const [tid, v] of Object.entries(checked)) {
    const val = getVal(v);
    const ca = getCA(v);
    if (val <= 0) continue;
    const [cid, td] = tid.split(':');
    if (cid === 'exam') continue;
    if (ca === date && td !== date) {
      const course = courses.find(c => c.id === cid);
      if (!course) continue;
      let taskText = course.name, taskTarget = 1, taskUnit = course.unit || '';
      if (schedule[td]) {
        const origTask = schedule[td].tasks.find(x => x.id === tid);
        if (origTask) { taskText = origTask.text; taskTarget = origTask.target; taskUnit = origTask.unit; }
      }
      completedOnThisDate.push({ id: tid, courseId: cid, subject: course.subject, text: taskText, target: taskTarget, unit: taskUnit, achieved: val, originalDate: td, type: course.type });
    }
  }
  const totalTarget = scheduledTasks.length; 
  const totalDone = scheduledTasks.reduce((s,t) => s + normDone(getVal(checked[t.id]), t.target), 0);
  const pct = totalTarget > 0 ? Math.round(totalDone / totalTarget * 100) : 0;
  const dateLabel = `${Number(date.slice(5,7))}월 ${Number(date.slice(8))}일 (${wd})`;
  
  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 fade-in" onClick={onClose}>
      <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[85vh] overflow-y-auto shadow-2xl" onClick={e=>e.stopPropagation()}>
        <div className="sticky top-0 bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between z-10">
          <div>
            <h3 className="text-base font-bold">{dateLabel}</h3>
            <div className="text-[11px] text-stone-500 tabular-nums">{date}</div>
          </div>
          <button onClick={onClose} className="p-1.5 hover:bg-stone-100 rounded-lg"><X className="w-5 h-5" /></button>
        </div>
        <div className="p-4 space-y-4">
          {isFinal && <div className="bg-gradient-to-br from-rose-500 to-red-500 text-white rounded-xl p-4 text-center"><div className="text-3xl mb-1">🚀</div><div className="text-base font-bold">{config.examName} D-DAY</div></div>}
          {milestone && !isFinal && <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-4 text-center"><div className="text-3xl mb-1">📝</div><div className="text-sm font-bold text-amber-800">{milestone.name}</div></div>}
          {isHoliday && !milestone && !isFinal && <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-center"><div className="text-3xl mb-1">🏖️</div><div className="text-sm font-bold text-amber-800">휴일 · 전면 휴식</div></div>}
          {!isHoliday && totalTarget > 0 && (
            <div className={`rounded-2xl p-4 ${pct === 100 ? 'bg-gradient-to-br from-emerald-500 to-teal-500 text-white' : pct >= 50 ? 'bg-gradient-to-br from-amber-400 to-orange-400 text-white' : pct > 0 ? 'bg-amber-50 border border-amber-200' : 'bg-stone-100'}`}>
              <div className="flex items-baseline gap-2">
                <div className="text-4xl font-black tabular-nums">{pct}%</div>
                <div className="text-xs opacity-90 tabular-nums">{Math.round(totalDone * 10) / 10} / {totalTarget} 달성</div>
              </div>
              <div className={`text-[11px] mt-1 ${pct >= 50 ? 'opacity-90' : 'text-stone-500'}`}>
                {pct === 100 ? '🔥 완벽한 하루' : pct >= 80 ? '💪 거의 다 했음' : pct >= 50 ? '👍 절반 넘김' : pct > 0 ? '🌱 시작은 했어' : '😴 기록 없음'}
              </div>
            </div>
          )}
          {scheduledTasks.length > 0 && (
            <div>
              <div className="flex items-center gap-1.5 mb-2"><Book className="w-4 h-4 text-stone-600" /><h4 className="text-xs font-bold text-stone-700">이 날 예정된 과제 ({scheduledTasks.length}개)</h4></div>
              <div className="space-y-1.5">
                {scheduledResults.map(t => {
                  const cfg = getSub(t.subject);
                  return (
                    <div key={t.id} className={`flex items-center gap-2 p-2.5 rounded-lg border ${t.status === 'over' ? 'bg-purple-50 border-purple-200' : t.status === 'done' ? 'bg-emerald-50 border-emerald-200' : t.status === 'partial' ? 'bg-amber-50 border-amber-200' : 'bg-stone-50 border-stone-200'}`}>
                      <div className={`w-5 h-5 rounded-md flex items-center justify-center flex-shrink-0 ${t.status === 'over' ? 'bg-purple-500' : t.status === 'done' ? 'bg-emerald-500' : t.status === 'partial' ? 'bg-amber-400' : 'bg-stone-300'}`}>
                        {(t.status === 'done' || t.status === 'over') && <Check className="w-3 h-3 text-white" />}
                        {t.status === 'partial' && <div className="w-2 h-2 bg-white rounded-sm" />}
                        {t.status === 'missed' && <X className="w-3 h-3 text-white" />}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-1 flex-wrap">
                          <span className={`text-[9px] font-bold px-1 py-0.5 rounded ${cfg.ch}`}>{t.subject}</span>
                          {t.status === 'over' && <span className="text-[9px] font-bold px-1 py-0.5 rounded bg-purple-100 text-purple-700">🔥 초과</span>}
                          {!t.doneOnDate && t.achieved > 0 && <span className="text-[9px] font-bold px-1 py-0.5 rounded bg-purple-100 text-purple-700 tabular-nums">{Number(t.completedAt.slice(5,7))}/{Number(t.completedAt.slice(8))} 만회완료</span>}
                        </div>
                        <div className={`text-xs font-semibold ${t.status === 'missed' ? 'text-stone-500' : 'text-stone-800'}`}>{t.text}</div>
                      </div>
                      <div className="text-[10px] tabular-nums font-mono font-bold flex-shrink-0">
                        <span className={t.status === 'over' ? 'text-purple-700' : t.status === 'done' ? 'text-emerald-700' : t.status === 'partial' ? 'text-amber-700' : 'text-stone-400'}>{t.achieved}</span>
                        <span className="text-stone-400">/{t.target}{t.unit}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {completedOnThisDate.length > 0 && (
            <div>
              <div className="flex items-center gap-1.5 mb-2"><span className="text-sm">🔥</span><h4 className="text-xs font-bold text-amber-800">이 날 만회한 과제 ({completedOnThisDate.length}개)</h4></div>
              <div className="space-y-1.5">
                {completedOnThisDate.map(t => {
                  const cfg = getSub(t.subject);
                  return (
                    <div key={t.id} className="flex items-center gap-2 p-2.5 rounded-lg bg-purple-50 border border-purple-200">
                      <div className="w-5 h-5 rounded-md bg-purple-500 flex items-center justify-center flex-shrink-0"><Check className="w-3 h-3 text-white" /></div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-1 flex-wrap">
                          <span className={`text-[9px] font-bold px-1 py-0.5 rounded ${cfg.ch}`}>{t.subject}</span>
                          <span className="text-[9px] font-bold px-1 py-0.5 rounded bg-stone-200 text-stone-700 tabular-nums">원래: {Number(t.originalDate.slice(5,7))}/{Number(t.originalDate.slice(8))}</span>
                        </div>
                        <div className="text-xs font-semibold text-stone-800">{t.text}</div>
                      </div>
                      <div className="text-[10px] tabular-nums font-mono font-bold text-purple-700 flex-shrink-0">+{t.achieved}{t.unit}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {!isHoliday && scheduledTasks.length === 0 && completedOnThisDate.length === 0 && (
            <div className="text-center py-8 text-stone-400"><div className="text-3xl mb-2">😴</div><div className="text-sm">이 날은 예정된 과제 없음</div></div>
          )}
        </div>
        <div className="border-t border-stone-200 p-3"><button onClick={onClose} className="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-lg text-sm font-bold">닫기</button></div>
      </div>
    </div>
  );
}

function DayCard({ ds, schedule, today, checked, periods, missed, showMissed, onToggle, onAdjust, onQuickEdit, popTaskId }) {
  const d = schedule[ds];
  if (!d) return null;
  const isT = ds === today;
  const isW = d.wd === '토' || d.wd === '일';
  const isE = d.isExam;
  const isM = d.isMilestone;
  const dt = d.tasks.length;
  const dd = d.tasks.reduce((s,t) => s + normDone(getVal(checked[t.id]), t.target), 0);
  const all = dt > 0 && dd >= dt - 0.001; 

  // 이 날 시간표 항목들
  const dayPeriods = periods && periods[ds] ? periods[ds] : [];
  const taskIds = new Set(d.tasks.map(t => t.id));
  // 과제ID → 연결된 교시번호 배열 (그날 깔린 과제가 시간표 몇 교시에 들어갔는지)
  const periodMap = {};
  for (const p of dayPeriods) {
    if (p.linkedTaskId && !p.linkedTaskId.startsWith('stock:') && taskIds.has(p.linkedTaskId)) {
      if (!periodMap[p.linkedTaskId]) periodMap[p.linkedTaskId] = [];
      periodMap[p.linkedTaskId].push(p.no);
    }
  }
  // 위 목록에 합칠 시간표 항목: ①자유입력(연동X) ②비축형(stock:) ③당겨푼 강좌(courseId:date인데 그날 원본 없음) — 그날 깔린 과제 연동은 d.tasks에 이미 있고 교시만 뱃지로 표시
  const ttExtra = dayPeriods.filter(p => 
    p.task?.trim() && (!p.linkedTaskId || p.linkedTaskId.startsWith('stock:') || !taskIds.has(p.linkedTaskId))
  );

  return (
    <div className={`bg-white rounded-2xl border shadow-sm overflow-hidden 
      ${isT?'border-rose-400 ring-2 ring-rose-200': isM?'border-amber-300 ring-1 ring-amber-100':'border-stone-200'} 
      ${isE?'bg-gradient-to-br from-rose-50 via-white to-amber-50':''}`}>
      <div className={`px-4 py-3 flex items-center justify-between 
        ${isT?'bg-rose-500 text-white': isM?'bg-amber-100': isW?'bg-stone-100':'bg-stone-50'} 
        ${isE?'!bg-gradient-to-r !from-rose-600 !to-red-500 !text-white':''}`}>
        <div className="flex items-center gap-2">
          <div className={`w-9 h-9 rounded-lg flex flex-col items-center justify-center font-bold ${isT||isE?'bg-white/20 text-white':'bg-white text-stone-700 border border-stone-200'}`}>
            <div className="text-[9px] leading-none">{d.wd}</div>
            <div className="text-sm leading-none mt-0.5 tabular-nums">{Number(ds.slice(8))}</div>
          </div>
          <div>
            <div className={`text-xs font-semibold tabular-nums ${isT||isE?'text-white/90':'text-stone-500'}`}>{Number(ds.slice(5,7))}월 {Number(ds.slice(8))}일</div>
            {d.special && <div className={`text-[11px] font-bold mt-0.5 ${isT||isE?'text-amber-200':isM?'text-amber-800':'text-rose-600'}`}>{d.special}</div>}
          </div>
        </div>
        <div className="text-right">
          {isT && <div className="text-[10px] font-black text-amber-200 tracking-widest">TODAY</div>}
          {dt > 0 && (
            <div className={`text-xs tabular-nums font-mono ${isT||isE?'text-white/80':'text-stone-500'}`}>
              {Math.round(dd)}/{dt} {all && '✓'}
            </div>
          )}
        </div>
      </div>
      <div className="p-3 space-y-2">
        {d.tasks.map(t => <Task key={t.id} t={t} v={getVal(checked[t.id])} onT={()=>onToggle(t)} onA={d=>onAdjust(t,d)} onE={()=>onQuickEdit(t)} pop={popTaskId===t.id} periodNos={periodMap[t.id]} />)}
        {ttExtra.map(p => {
          const cfg = getSub(p.subject);
          const isStock = p.linkedTaskId && p.linkedTaskId.startsWith('stock:');
          return (
            <div key={`tt-${p.no}`} className={`flex items-start gap-2 p-3 rounded-xl border ${p.done?'bg-stone-50 border-stone-200':`${cfg.bg} ${cfg.bd}`}`}>
              <div className={`flex-shrink-0 w-6 h-6 rounded-md flex items-center justify-center mt-0.5 ${p.done?'bg-emerald-500':'bg-stone-300'}`}>
                {p.done ? <Check className="w-4 h-4 text-white" /> : <div className="w-2.5 h-2.5 bg-white rounded-sm" />}
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-1.5 flex-wrap mb-0.5">
                  <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${cfg.ch}`}>{p.subject}</span>
                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700">{p.no === 8 ? '자습' : `${p.no}교시`}</span>
                  {isStock && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-purple-100 text-purple-700">비축</span>}
                </div>
                <div className={`text-sm font-semibold ${p.done?'text-stone-400 line-through':'text-stone-800'}`}>{p.task}</div>
              </div>
            </div>
          );
        })}
        {showMissed && missed.length > 0 && (
          <div className="mt-3 pt-3 border-t-2 border-dashed border-amber-300">
            <div className="flex items-center gap-1.5 mb-2">
              <Warn className="w-4 h-4 text-amber-600" />
              <span className="text-xs font-bold text-amber-800">밀린 과제 · 남는 시간에 만회 ({missed.length}개)</span>
            </div>
            <div className="space-y-2">
              {missed.map(t => <Task key={`m-${t.id}`} t={t} v={getVal(checked[t.id])} onT={()=>onToggle(t, true)} onA={d=>onAdjust(t,d, true)} onE={()=>onQuickEdit({...t, _fromMissed: true})} isMissed od={t.originalDate} pop={popTaskId===t.id} />)}
            </div>
          </div>
        )}
        {d.tasks.length === 0 && !showMissed && ttExtra.length === 0 && (
          <div className="text-center text-stone-400 py-8 text-sm">
            <div className="text-2xl mb-1">{d.isHoliday?'🏖️':'😴'}</div>
            <div>{d.isHoliday?'휴일이야 · 진짜 쉬어':'쉬는 날'}</div>
          </div>
        )}
        {d.isHoliday && d.tasks.length > 0 && (
          <div className="text-[10px] text-amber-700 text-center bg-amber-50 border border-amber-200 rounded-lg py-1.5 font-semibold">
            🏖️ 휴일이지만 단발형 과제는 표시됨
          </div>
        )}
      </div>
    </div>
  );
}

function Task({ t, v, onT, onA, onE, pop, isMissed, od, periodNos }) {
  const cfg = getSub(t.subject);
  const tgt = t.target;
  const showSteppers = (t.type === 'quota' || t.type === 'lesson') && t.courseId !== 'exam';
  const done = v >= tgt, partial = v > 0 && v < tgt, over = v > tgt;
  const step = t.type === 'lesson' ? 1 : (tgt >= 100 ? 10 : tgt >= 20 ? 5 : 1);

  return (
    <div className={`flex items-start gap-2 p-3 rounded-xl ${done?'bg-stone-50 border border-stone-200':`${cfg.bg} border ${cfg.bd}`} ${isMissed&&!done?'ring-1 ring-amber-300':''} ${over?'!ring-2 !ring-purple-300':''}`}>
      <button onClick={onT} className={`flex-shrink-0 w-6 h-6 rounded-md border-2 flex items-center justify-center mt-0.5 ${over?'bg-purple-500 border-purple-500':done?'bg-emerald-500 border-emerald-500':partial?'bg-amber-100 border-amber-400':`bg-white ${cfg.bd.replace('-200','-400')}`} ${pop?'check-pop':''}`}>
        {(done || over) && <Check className="w-4 h-4 text-white" />}
        {partial && !done && <div className="w-2.5 h-2.5 bg-amber-500 rounded-sm" />}
      </button>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1.5 flex-wrap mb-0.5">
          <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${cfg.ch}`}>{t.subject}</span>
          {periodNos && periodNos.length > 0 && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700">{periodNos.sort((a,b)=>a-b).map(n => n === 8 ? '자습' : `${n}`).join(',')}{periodNos.every(n=>n===8)?'':'교시'}</span>}
          {isMissed && od && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-200 text-amber-900 tabular-nums">{Number(od.slice(5,7))}/{Number(od.slice(8))} 놓침</span>}
          {over && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-purple-100 text-purple-700">🔥 초과 +{v - tgt}</span>}
          {t.isPostComplete && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">완강 후</span>}
        </div>
        <div className={`text-sm font-semibold ${done&&!over?'text-stone-400 line-through':'text-stone-800'}`}>
          {t.text}
          {t.type === 'quota' && tgt > 1 && <span className="ml-1 text-stone-500 font-normal">{tgt}{t.unit}</span>}
        </div>
        {t.note && <div className={`text-xs mt-0.5 ${done&&!over?'text-stone-300':'text-stone-500'}`}>{t.note}</div>}
        {showSteppers && (
          <div className="mt-2 flex items-center gap-2">
            <button onClick={()=>onA(-step)} disabled={v<=0} className="w-7 h-7 flex items-center justify-center bg-white border border-stone-300 rounded-md hover:bg-stone-100 disabled:opacity-30"><Minus className="w-3.5 h-3.5" /></button>
            <button onClick={onE} className="flex-1 min-w-0 text-center tabular-nums font-mono font-bold text-sm py-1.5 rounded-md bg-white border border-stone-300 hover:bg-stone-100">
              <span className={over?'text-purple-700':partial?'text-amber-700':done?'text-emerald-700':'text-stone-700'}>{v}</span>
              <span className="text-stone-400"> / {tgt}{t.unit}</span>
            </button>
            <button onClick={()=>onA(step)} className="w-7 h-7 flex items-center justify-center bg-white border border-stone-300 rounded-md hover:bg-stone-100"><Plus className="w-3.5 h-3.5" /></button>
          </div>
        )}
      </div>
    </div>
  );
}

function QuickEdit({ task, cur, onSet, onClose }) {
  const [inp, setInp] = useState(String(cur));
  const cfg = getSub(task.subject);
  const save = () => { const n = parseInt(inp,10); if (!isNaN(n)) onSet(n); onClose(); };
  const qv = [0, Math.floor(task.target/2) || 1, task.target, task.target + Math.max(1, Math.floor(task.target*0.5))];

  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}>

function Courses({ courses, config, today, activeExamDate, periods, onEdit, onDel, onAdd, onTogH, updCfg, updMilestones }) {

  const [hO, setHO] = useState(false);

  const [newMDate, setNewMDate] = useState('');
  const milestones = config.milestones || [];

  const addMilestone = () => {
    if (!newMName.trim() || !newMDate) { alert('이름이랑 날짜 둘 다 입력해 임마'); return; }

    const m = { id: 'm-' + Date.now(), name: newMName.trim(), date: newMDate };
    updMilestones([...milestones, m]);
    setNewMName(''); setNewMDate('');

  const removeMilestone = (id) => {

    <>

          <ChevronRight className={`w-4 h-4 text-stone-400 transition-transform ${cO?'rotate-90':''}`} />
        </button>
        {cO && (
          <div className="px-4 pb-4 pt-1 space-y-2">

            <div className="grid grid-cols-2 gap-2">
              <Row label="시작일"><input type="date" value={config.startDate} onChange={e=>updCfg({...config, startDate:e.target.value})} className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm" /></Row>
              <Row label="최종 시험일"><input type="date" value={config.endDate} onChange={e=>updCfg({...config, endDate:e.target.value})} className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm" /></Row>

          <ChevronRight className={`w-4 h-4 text-stone-400 transition-transform ${mO?'rotate-90':''}`} />
        </button>
        {mO && (
          <div className="px-4 pb-4 pt-1 space-y-2">
            <p className="text-[11px] text-stone-500">9모, 10모 학평 같은 중간 시험 추가하면 캘린더랑 D-day에 자동 표시됨</p>

            <div className="flex gap-2">

            <div className="space-y-1.5 pt-1">
              {milestones.length===0 && <span className="text-xs text-stone-400">등록된 중간 시험 없음. 9모/10모 추가해봐</span>}
              {[...milestones].sort((a,b) => a.date.localeCompare(b.date)).map(m => {
                const dleft = dDay(today, m.date);
                const isPast = pd(m.date) < pd(today);
                return (
                  <div key={m.id} className={`flex items-center justify-between px-3 py-2 rounded-lg border ${isPast?'bg-stone-50 border-stone-200 opacity-60':'bg-amber-50 border-amber-200'}`}>

                        <div className="text-sm font-bold text-stone-800 truncate">{m.name}</div>
                        <div className="text-[11px] text-stone-600 tabular-nums">{m.date} ({dowN(m.date)}) {!isPast && `· D-${dleft}`}</div>

                    <button onClick={()=>removeMilestone(m.id)} className="p-1.5 text-stone-500 hover:text-rose-600 hover:bg-white rounded flex-shrink-0"><Trash className="w-4 h-4" /></button>

        )}

      <section className="mb-4 bg-white border border-stone-200 rounded-2xl overflow-hidden shadow-sm">

        {hO && (

            <div className="flex gap-2">
              <input type="date" value={nh} onChange={e=>setNh(e.target.value)} className="flex-1 px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm" />
              <button onClick={()=>{ if(nh && !config.holidays.includes(nh)){onTogH(nh); setNh('');} }} className="px-3 py-2 bg-stone-800 text-white rounded-lg text-sm font-semibold">추가</button>
            </div>
            <div className="flex flex-wrap gap-1.5">
              {config.holidays.length===0 && <span className="text-xs text-stone-400">등록된 휴일 없음</span>}
              {[...config.holidays].sort().map(h => (
                <span key={h} className="inline-flex items-center gap-1 px-2 py-1 bg-rose-50 border border-rose-200 text-rose-700 rounded-lg text-xs font-semibold tabular-nums">
                  {h}<button onClick={()=>onTogH(h)} className="hover:text-rose-900"><X className="w-3 h-3" /></button>
                </span>
              ))}
            </div>
          </div>
        )}
      </section>

      <section className="space-y-3 mb-4">
        <div className="flex items-center justify-between">
          <h2 className="text-sm font-bold text-stone-700">내 강좌</h2>

        {courses.length===0 && (

      </section>
    </>
  );
}

function CCard({ c, h, cfg, td, activeExamDate, periods, onE, onD }) {
  const col = getSub(c.subject);

  const DOW = ['일','월','화','수','목','금','토'];
  const typeLabel = c.type==='lesson'?'진도형':c.type==='quota'?'분량형':c.type==='stock'?'비축형':'단발형';
  // 비축형: 시간표에서 이 강좌를 차감한 총량 계산
  let stockUsed = 0;
  if (c.type === 'stock' && periods) {
    for (const list of Object.values(periods)) {
      for (const p of list) {
        if (p.done && p.linkedTaskId === `stock:${c.id}`) stockUsed += (p.qty != null ? p.qty : (c.stepUnit || 1));
      }
    }
  }
  const stockLeft = Math.max(0, (c.stockTotal || 0) - stockUsed);
  
  return (
    <div className={`bg-white border ${col.bd} rounded-2xl shadow-sm overflow-hidden`}>
      <div className={`px-4 py-3 ${col.bg} border-b ${col.bd} flex items-start justify-between gap-2`}>

            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${col.ch}`}>{c.subject}</span>
            <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-white text-stone-600 border border-stone-200">{typeLabel}</span>

              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 tabular-nums">하루 {c.lessonsPerDay}{c.unit}</span>
            )}

              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-sky-100 text-sky-700 tabular-nums">시작 {c.startFromDate.slice(5).replace('-','/')}</span>
            )}

          <button onClick={onD} className="p-1.5 hover:bg-white rounded-lg hover:text-rose-600"><Trash className="w-4 h-4" /></button>

            <div className="flex justify-between"><span className="text-stone-500">하루 분량</span><span className="font-semibold tabular-nums">{s.perDay}{c.unit}</span></div>

            <div className="flex justify-between"><span className="text-stone-500">최대 가능 분량</span><span className="font-semibold tabular-nums">{s.capacity}{c.unit}</span></div>
            <div className="flex justify-between"><span className="text-stone-500">완강 목표</span><span className="font-semibold tabular-nums">{c.targetDate}</span></div>
            {!s.feasible && s.remaining>0 && (
              <div className="flex items-center gap-1.5 mt-2 px-2 py-1.5 bg-rose-50 border border-rose-200 rounded-lg">

              </div>

          <>

            <div className="flex justify-between"><span className="text-stone-500">1회 차감</span><span className="font-semibold tabular-nums">{c.stepUnit}{c.unit}</span></div>
            <div className="h-2 bg-stone-100 rounded-full overflow-hidden mt-1">
              <div className={`h-full ${stockLeft===0?'bg-rose-400':'bg-indigo-500'} transition-all`} style={{width:`${c.stockTotal>0?Math.min(100, stockUsed/c.stockTotal*100):0}%`}} />

            {stockLeft===0 && <div className="text-[11px] text-rose-700 font-semibold text-center mt-1">🏁 비축 소진 완료! 새로 들어오면 총 개수 늘려</div>}
            <div className="text-[10px] text-stone-400 text-center pt-1">시간표에서 "비축 꺼내기"로 차감 · 캘린더엔 안 깔림</div>
          </>
        )}
        {(c.type === 'lesson' || c.type === 'quota') && (
          <div className="flex justify-between items-center pt-1">
            <span className="text-stone-500">요일</span>

              {[0,1,2,3,4,5,6].map(d => (
                <span key={d} className={`w-5 h-5 rounded flex items-center justify-center text-[9px] font-bold ${c.days.includes(d)?`${col.br} text-white`:'bg-stone-100 text-stone-400'}`}>{DOW[d]}</span>
              ))}

          </div>

  );
